<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
:root{--bg:#0e1621;--panel:#17212b;--line:#0b121a;--acc:#2b95d6;--mine:#2b5278;--txt:#e8eef4;--mut:#7f91a4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font:inherit;color:inherit}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:var(--panel);border-radius:18px;padding:2rem;width:360px;max-width:100%;text-align:center}
.box .logo{font-size:3.2rem}.box h1{font-size:1.3rem;margin:.4rem 0}.box p{color:var(--mut);font-size:.88rem;margin-bottom:1rem}
.box input{width:100%;padding:.8rem 1rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin-bottom:.7rem;text-align:center}
.box input:focus,.search:focus,#msg:focus{outline:0;border-color:var(--acc)}
.btn{width:100%;padding:.8rem;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}
.link{color:var(--acc);font-size:.82rem;margin-top:.7rem}
#err{color:#f87171;font-size:.82rem;min-height:1.1rem;margin-top:.6rem}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;left:12px;max-width:340px;margin-left:auto;background:#223244;border-left:4px solid var(--acc);padding:.8rem 1rem;border-radius:10px;font-size:.88rem;z-index:50;box-shadow:0 6px 24px #0008}
#toast b{font-size:1.2rem;letter-spacing:3px;color:#fff}
#app{height:100%;display:flex}
.side{width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.top{display:flex;gap:.5rem;align-items:center;padding:.7rem}
.menu{width:40px;height:40px;border-radius:50%;font-size:1.2rem}.menu:hover{background:#223244}
.search{flex:1;padding:.55rem 1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
.list{flex:1;overflow-y:auto}
.row{display:flex;gap:.7rem;padding:.65rem .8rem;align-items:center;cursor:pointer}
.row:hover{background:#1f2c3a}.row.on{background:var(--mine)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4fb3f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between}
.nm small{color:var(--mut);font-weight:400;font-size:.7rem}
.pv{color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);text-align:center;padding:2rem 1rem;font-size:.85rem;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#0e1621}
.ph{margin:auto;color:var(--mut);background:#182533;padding:.4rem 1rem;border-radius:999px;font-size:.85rem}
.hd{display:flex;align-items:center;gap:.7rem;padding:.65rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:none;font-size:1.3rem}
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.m{max-width:72%;padding:.45rem .75rem;border-radius:14px;font-size:.93rem;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:#182533;border-bottom-left-radius:4px}
.m i{font-style:normal;font-size:.65rem;color:#9fb3c8;margin-left:.6rem;float:right;margin-top:.45rem}
.big{font-size:2.2rem;line-height:1.2}
.day{align-self:center;background:#182533;color:var(--mut);font-size:.72rem;padding:.15rem .7rem;border-radius:999px;margin:.4rem 0}
.bar{display:flex;gap:.4rem;padding:.6rem .8rem;background:var(--panel);align-items:center}
#msg{flex:1;padding:.7rem 1.1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
.ib{width:40px;height:40px;border-radius:50%;font-size:1.3rem}.ib:hover{background:#223244}
.send{background:var(--acc);color:#fff}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;padding:.5rem;background:var(--panel);border-top:1px solid var(--line);max-height:190px;overflow-y:auto}
#emo button{font-size:1.5rem;padding:.25rem;border-radius:8px}#emo button:hover{background:#223244}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:1rem}
.md{background:var(--panel);border-radius:16px;padding:1.5rem;width:380px;max-width:100%;max-height:90%;overflow-y:auto;text-align:center}
.md input{width:100%;padding:.7rem 1rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin:.3rem 0 .6rem}
.md .av{width:90px;height:90px;font-size:2rem;margin:0 auto .6rem}
.sec{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem;font-size:.85rem;color:var(--mut)}
.out{margin-top:.8rem;color:#f87171;font-weight:600}
@media(max-width:800px){.side{width:100%}.back{display:block}.in-chat .side{display:none}#app:not(.in-chat) .main{display:none}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3948;border-radius:3px}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>

<div id="auth">
 <div class="box">
  <div class="logo">✈️</div>
  <h1 id="t">Messenger</h1>
  <p id="s">Email manzilingizni kiriting, tasdiqlash kodi yuboramiz</p>
  <input id="f" type="email" placeholder="Email" autocomplete="off">
  <button class="btn" id="go">Davom etish</button>
  <button class="link hidden" id="re">Kodni qayta yuborish</button>
  <div id="err"></div>
 </div>
</div>

<div id="app" class="hidden">
 <aside class="side">
  <div class="top"><button class="menu" id="menu">☰</button><input class="search" id="q" placeholder="Qidirish"></div>
  <div class="list" id="list"></div>
 </aside>
 <main class="main">
  <div class="ph" id="ph">Suhbatni tanlang</div>
  <div class="hidden" id="chat" style="flex:1;display:flex;flex-direction:column;min-height:0">
   <div class="hd"><button class="back" id="back">←</button><div class="av" id="pav"></div><b id="pn"></b></div>
   <div class="msgs" id="msgs"></div>
   <div id="emo" class="hidden"></div>
   <form class="bar" id="form"><button type="button" class="ib" id="eb">😊</button><input id="msg" placeholder="Xabar yozing..." autocomplete="off"><button class="ib send">➤</button></form>
  </div>
 </main>
</div>

<div class="ov hidden" id="ov"><div class="md">
 <div class="av" id="mav"></div>
 <label class="ib send" style="display:inline-block;line-height:40px;font-size:1rem;cursor:pointer">📷<input type="file" id="pic" accept="image/*" hidden></label>
 <input id="nn" placeholder="Ism">
 <button class="btn" id="sv">Saqlash</button>
 <div class="sec">
  <div id="tfs"></div>
  <input id="p1" type="password" placeholder="Yangi 2FA parol (kamida 6 belgi)">
  <button class="btn" id="tf">2FA ni yoqish</button>
 </div>
 <button class="link" id="x">Yopish</button>
 <div><button class="out" id="lo">🚪 Chiqish</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Xotira to\'ldi')}}};
const U=()=>ls.get('tg_users',[]),M=()=>ls.get('tg_msgs',[]);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const hash=async(p,salt)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const EMO='😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😢 😭 😡 👍 👎 👏 🙏 💪 🔥 ❤️ 💔 🎉 ✨ 🌹 🎁 ☕ 🍕 ⚽ 🚀 🌍 😴 🤝 👋 😱 🥰 😇 🙄 😅 🤗 🤩 😜 🫡 🥳 😏 🤯 😬 🙌 💯 ✅ ❌ ⭐ 🌙 ☀️ 🐱 🐶 🍉 🎵'.split(' ');
let me=null,peer=null,flow={},q='';

// ---------- AUTH ----------
const err=t=>$('#err').textContent=t||'';
function step(n,t,s,ph,type='text'){flow.n=n;$('#t').textContent=t;$('#s').textContent=s;const f=$('#f');f.value='';f.type=type;f.placeholder=ph;f.focus();err();$('#re').classList.toggle('hidden',n!=='code')}
function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.remove('hidden');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.add('hidden'),30000)}
function sendCode(){flow.code=String(Math.floor(100000+Math.random()*900000));flow.exp=Date.now()+300000;flow.tries=0;
 toast('📩 <small>Demo: haqiqiy email yuborilmaydi (server yo\'q)</small><br>'+esc(flow.email)+' uchun kod: <b>'+flow.code+'</b>')}
$('#go').onclick=async()=>{
 const v=$('#f').value.trim();err();
 if(flow.n==='email'||!flow.n){
  if(!/^\S+@\S+\.\S+$/.test(v))return err('Email noto\'g\'ri');
  flow.email=v.toLowerCase();sendCode();step('code','Kodni kiriting',flow.email+' manziliga 6 xonali kod yuborildi','000000');
 }else if(flow.n==='code'){
  if(Date.now()>flow.exp)return err('Kod muddati tugadi, qayta yuboring');
  if(++flow.tries>5){err('Juda ko\'p urinish. Yangi kod oling');return}
  if(v!==flow.code)return err('Kod noto\'g\'ri');
  flow.code=null;const u=U().find(x=>x.email===flow.email);
  if(!u)return step('name','Ismingiz','Profil uchun ism kiriting','Ism');
  if(u.tfa)return flow.u=u,step('2fa','Ikki bosqichli himoya','2FA parolingizni kiriting','Parol','password');
  login(u);
 }else if(flow.n==='name'){
  if(!v)return err('Ism kiriting');
  const u={id:Date.now(),name:v,email:flow.email,avatar:null,tfa:null,salt:crypto.randomUUID()};
  ls.set('tg_users',[...U(),u]);login(u);
 }else if(flow.n==='2fa'){
  if(await hash(v,flow.u.salt)!==flow.u.tfa)return err('Parol xato');
  login(flow.u);
 }
};
$('#f').addEventListener('keydown',e=>e.key==='Enter'&&$('#go').click());
$('#re').onclick=()=>{sendCode();err()};
function login(u){me=u;ls.set('tg_session',u.id);$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');toast('');$('#toast').classList.add('hidden');flow={};render()}

// ---------- UI ----------
const avHtml=u=>u.avatar?`<img src="${u.avatar}" alt="">`:esc((u.name||'?')[0].toUpperCase());
const tm=t=>new Date(t).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
const dayOf=t=>new Date(t).toLocaleDateString('uz-UZ',{day:'numeric',month:'long'});
const thread=id=>M().filter(m=>(m.f===me.id&&m.t===id)||(m.f===id&&m.t===me.id));
function render(){renderList();if(peer)renderMsgs()}
function renderList(){
 const L=$('#list'),all=U().filter(u=>u.id!==me.id&&(!q||(u.name+u.email).toLowerCase().includes(q)));
 const rows=all.map(u=>({u,l:thread(u.id).slice(-1)[0]})).sort((a,b)=>(b.l?.at||0)-(a.l?.at||0));
 L.innerHTML=rows.length?'':'<div class="empty">Foydalanuvchilar topilmadi.<br>Boshqa brauzer oynasida ro\'yxatdan o\'tib sinab ko\'ring.</div>';
 rows.forEach(({u,l})=>{const d=document.createElement('div');d.className='row'+(peer?.id===u.id?' on':'');
  d.innerHTML=`<div class="av">${avHtml(u)}</div><div class="info"><div class="nm"><span>${esc(u.name)}</span><small>${l?tm(l.at):''}</small></div><div class="pv">${l?(l.f===me.id?'Siz: ':'')+esc(l.b):'Xabar yo\'q'}</div></div>`;
  d.onclick=()=>open(u);L.appendChild(d)})}
function open(u){peer=u;$('#app').classList.add('in-chat');$('#ph').classList.add('hidden');$('#chat').classList.remove('hidden');
 $('#pn').textContent=u.name;$('#pav').innerHTML=avHtml(u);renderMsgs();renderList();$('#msg').focus()}
const onlyEmoji=s=>/^(\p{Extended_Pictographic}|\u200d|\ufe0f|\s){1,6}$/u.test(s);
function renderMsgs(){
 const E=$('#msgs'),T=thread(peer.id);let last='';
 E.innerHTML=T.length?'':'<div class="empty" style="margin:auto">Birinchi bo\'lib yozing 👋</div>';
 T.forEach(m=>{const d=dayOf(m.at);if(d!==last){last=d;E.insertAdjacentHTML('beforeend',`<div class="day">${d}</div>`)}
  E.insertAdjacentHTML('beforeend',`<div class="m ${m.f===me.id?'me':'th'}"><span class="${onlyEmoji(m.b)?'big':''}">${esc(m.b)}</span><i>${tm(m.at)}</i></div>`)});
 E.scrollTop=E.scrollHeight}
$('#form').onsubmit=e=>{e.preventDefault();const b=$('#msg').value.trim();if(!b||!peer)return;
 ls.set('tg_msgs',[...M(),{id:Date.now(),f:me.id,t:peer.id,b,at:Date.now()}]);$('#msg').value='';render()};
$('#back').onclick=()=>{peer=null;$('#app').classList.remove('in-chat');$('#chat').classList.add('hidden');$('#ph').classList.remove('hidden');renderList()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();renderList()};
// emoji
$('#emo').innerHTML=EMO.map(e=>`<button type="button">${e}</button>`).join('');
$('#emo').onclick=e=>{if(e.target.tagName==='BUTTON'){const i=$('#msg');i.value+=e.target.textContent;i.focus()}};
$('#eb').onclick=()=>$('#emo').classList.toggle('hidden');
// settings
function tfaUi(){$('#tfs').textContent=me.tfa?'🔒 2FA yoqilgan':'🔓 2FA o\'chiq — qo\'shimcha parol bilan himoyalang';
 $('#tf').textContent=me.tfa?'2FA ni o\'chirish':'2FA ni yoqish';$('#p1').placeholder=me.tfa?'Joriy 2FA parol':'Yangi 2FA parol (kamida 6 belgi)';$('#p1').value=''}
$('#menu').onclick=()=>{$('#ov').classList.remove('hidden');$('#mav').innerHTML=avHtml(me);$('#nn').value=me.name;tfaUi()};
$('#x').onclick=()=>$('#ov').classList.add('hidden');
function upd(patch){const us=U(),i=us.findIndex(u=>u.id===me.id);us[i]={...us[i],...patch};ls.set('tg_users',us);me=us[i];render()}
$('#sv').onclick=()=>{const n=$('#nn').value.trim();if(n){upd({name:n});$('#ov').classList.add('hidden')}};
$('#pic').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1e6)return alert('Rasm 1MB dan kichik bo\'lsin');
 const r=new FileReader();r.onload=()=>{upd({avatar:r.result});$('#mav').innerHTML=avHtml(me)};r.readAsDataURL(f)};
$('#tf').onclick=async()=>{const p=$('#p1').value;
 if(me.tfa){if(await hash(p,me.salt)!==me.tfa)return alert('Parol xato');upd({tfa:null})}
 else{if(p.length<6)return alert('Parol kamida 6 belgi bo\'lsin');upd({tfa:await hash(p,me.salt)})}
 tfaUi()};
$('#lo').onclick=()=>{localStorage.removeItem('tg_session');location.reload()};
addEventListener('storage',()=>me&&render());
// init
(()=>{const id=ls.get('tg_session',null),u=id&&U().find(x=>x.id===id);if(u)login(u);else step('email','Messenger','Email manzilingizni kiriting, tasdiqlash kodi yuboramiz','Email','email')})();
</script>
</body>
</html>
