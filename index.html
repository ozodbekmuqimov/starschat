<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UZ Messenger</title>
<style>
:root{--bg:#0e1621;--pn:#17212b;--ln:#0b121a;--ac:#2b95d6;--me:#2b5278;--mu:#7f91a4;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#e8eef4;overflow:hidden}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:inherit}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:var(--pn);border-radius:18px;padding:2rem;width:360px;max-width:100%;text-align:center}
.box .logo{font-size:3.2rem}.box h1{font-size:1.3rem;margin:.4rem 0}.box p{color:var(--mu);font-size:.88rem;margin-bottom:1rem}
.box input{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin:.3rem 0 .6rem;text-align:center}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
.btn{width:100%;padding:.8rem;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.link{color:var(--ac);font-size:.82rem;margin-top:.6rem}
#err{color:#f87171;font-size:.82rem;min-height:1.1rem;margin-top:.5rem}
#toast{position:fixed;top:12px;right:12px;left:12px;max-width:340px;margin-left:auto;background:#223244;border-left:4px solid var(--ac);padding:.8rem 1rem;border-radius:10px;font-size:.88rem;z-index:60;box-shadow:0 6px 24px #0008}
#toast b{font-size:1.2rem;letter-spacing:3px}
#app{height:100%;display:flex}
.side{width:340px;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex-shrink:0}
.top{display:flex;gap:.4rem;align-items:center;padding:.7rem}
.ib{width:40px;height:40px;border-radius:50%;font-size:1.25rem;flex-shrink:0}.ib:hover{background:#223244}
.send{background:var(--ac);color:#fff}
#q{flex:1;min-width:0;padding:.55rem 1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
.list{flex:1;overflow-y:auto}
.hdr{color:var(--ac);font-size:.75rem;font-weight:700;padding:.7rem 1rem .3rem}
.row{display:flex;gap:.7rem;padding:.65rem .8rem;align-items:center;cursor:pointer}
.row:hover{background:#1f2c3a}.row.on{background:var(--me)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4fb3f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:.4rem}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mu);font-weight:400;font-size:.7rem}
.pv{color:var(--mu);font-size:.8rem;display:flex;justify-content:space-between;gap:.4rem}
.pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un{background:var(--ac);color:#fff;border-radius:999px;font-size:.7rem;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.empty{color:var(--mu);text-align:center;padding:2rem 1rem;font-size:.85rem;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.ph{margin:auto;color:var(--mu);background:#182533;padding:.4rem 1rem;border-radius:999px;font-size:.85rem}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.hd{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;background:var(--pn);border-bottom:1px solid var(--ln)}
.hd small{display:block;color:var(--mu);font-size:.75rem}
.back{display:none;font-size:1.3rem}
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.m{max-width:72%;padding:.45rem .75rem;border-radius:14px;font-size:.93rem;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:#182533;border-bottom-left-radius:4px}
.m i{font-style:normal;font-size:.65rem;color:#9fb3c8;margin-left:.6rem;float:right;margin-top:.45rem}
.m img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-bottom:.3rem}
.sn{display:block;color:#6ab7f0;font-size:.78rem}
.fc{display:flex;gap:.6rem;align-items:center;color:inherit;text-decoration:none;background:#0003;padding:.5rem;border-radius:10px;margin-bottom:.3rem;word-break:break-all}
.fc small{color:#9fb3c8}
.big{font-size:2.2rem;line-height:1.2}
.day{align-self:center;background:#182533;color:var(--mu);font-size:.72rem;padding:.15rem .7rem;border-radius:999px;margin:.4rem 0}
.bar{display:flex;gap:.3rem;padding:.6rem .8rem;background:var(--pn);align-items:center}
#msg{flex:1;min-width:0;padding:.7rem 1.1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
#att{padding:.4rem 1rem;background:var(--pn);font-size:.82rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln)}
#jb{padding:.8rem;background:var(--pn);text-align:center;color:var(--mu);font-size:.88rem}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;padding:.5rem;background:var(--pn);border-top:1px solid var(--ln);max-height:190px;overflow-y:auto}
#emo button{font-size:1.5rem;padding:.25rem;border-radius:8px}#emo button:hover{background:#223244}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:1rem}
.md{background:var(--pn);border-radius:16px;padding:1.5rem;width:380px;max-width:100%;max-height:90%;overflow-y:auto;text-align:center}
.md h2{font-size:1.1rem;color:var(--ac);margin-bottom:.6rem}
.md .av{width:90px;height:90px;font-size:2rem;margin:0 auto .6rem}
.sec{border-top:1px solid var(--ln);margin-top:1rem;padding-top:1rem;font-size:.85rem;color:var(--mu)}
.out{margin-top:.8rem;color:#f87171;font-weight:600}
.ck{display:flex;gap:.6rem;align-items:center;padding:.35rem 0;text-align:left;font-size:.9rem}
.ck input{width:auto;margin:0}
.navt{display:flex;border-bottom:1px solid var(--ln)}.nt{flex:1;padding:.6rem;color:var(--mu);font-size:.85rem;border-bottom:2px solid transparent}.nt.on{color:var(--ac);border-color:var(--ac)}
.lg{width:34px;height:34px;border-radius:50%;flex-shrink:0}
#feed{flex:1;display:flex;flex-direction:column;min-height:0}.fbody{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem;align-items:center}.fbody>*{width:100%;max-width:600px}#fl{display:flex;flex-direction:column;gap:1rem}
.pc{background:var(--pn);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}.pc textarea{background:transparent;border:0;color:inherit;resize:none;min-height:56px;outline:0;font:inherit}.pc img,.pc video,.m video{max-width:100%;border-radius:10px}.m audio{max-width:100%}
.ph2{display:flex;gap:.7rem;align-items:center}.ph2 small{display:block;color:var(--mu);font-size:.72rem}.pb{white-space:pre-wrap;word-wrap:break-word}.pa{display:flex;gap:.8rem;align-items:center;color:var(--mu);font-size:.85rem}
@supports(height:100dvh){html,body,#app,#auth{height:100dvh}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.box{animation:up .4s}#app{animation:fd .4s}.ov{animation:fd .2s}.ov>.md{animation:pop .22s}#chat,#feed{animation:sl .25s}.msgs>.m:last-child,.pc{animation:up .25s}
#pin{padding:.4rem 1rem;background:var(--pn);border-bottom:1px solid var(--ln);border-left:3px solid var(--ac);font-size:.82rem;cursor:pointer;display:flex;gap:.5rem;align-items:center}#pin span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pin small{color:var(--mu)}
#sel{display:flex;justify-content:space-between;align-items:center;padding:.4rem 1rem;background:#223244}.m.sel{outline:2px solid var(--ac)}.pm{float:left;margin-right:.3rem;font-size:.7rem}
#rbar{gap:.8rem;align-items:center}#pav,#pn{cursor:pointer}
@media(max-width:800px){.side{width:100%}.back{display:block}.in-chat .side{display:none}#app:not(.in-chat) .main{display:none}#app.feed .side{display:none}#app.feed .main{display:flex!important}.m{max-width:86%}input,textarea{font-size:16px!important}.box{padding:1.5rem}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3948;border-radius:3px}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>

<div id="auth"><div class="box">
 <div class="logo">💬</div><h1 id="t">Messenger</h1><p id="s">Email manzilingizni kiriting</p>
 <input id="f" autocomplete="off">
 <button class="btn" id="go">Davom etish</button>
 <button class="link hidden" id="re">Kodni qayta yuborish</button>
 <div id="err"></div>
</div></div>

<div id="app" class="hidden">
 <aside class="side">
  <div class="top"><button class="ib" id="menu" title="Profil">☰</button><input id="q" placeholder="Qidirish (@username yoki email)"><button class="ib" id="new" title="Yangi guruh/kanal">✏️</button></div>
  <div class="navt"><button class="nt on" data-v="chats">💬 Chatlar</button><button class="nt" data-v="feed">📰 Postlar</button><button class="nt" id="ctb">👤 Kontaktlar</button></div><div class="list" id="list"></div>
 </aside>
 <main class="main">
  <div class="ph" id="ph">Suhbatni tanlang</div>
  <div class="hidden" id="feed"><div class="hd"><button class="back" id="fb">←</button><b>📰 Postlar</b></div><div class="fbody"><div class="pc"><textarea id="pt" placeholder="Nima yangilik?"></textarea><div class="pa"><label class="ib" style="display:flex;align-items:center;justify-content:center;cursor:pointer">📎<input type="file" id="pfile" hidden></label><span id="pfn"></span><button class="btn" id="pp" style="width:auto;padding:.5rem 1.2rem;margin-left:auto">Post</button></div></div><div id="fl"></div></div></div>
  <div class="hidden" id="chat">
   <div class="hd"><button class="back" id="back">←</button><div class="av" id="pav"></div><div><b id="pn"></b><small id="ps"></small></div></div>
   <div id="pin" class="hidden"></div><div id="sel" class="hidden"><button class="btn" id="selp" style="width:auto;padding:.4rem 1rem"></button><button id="selx" class="ib">✕</button></div><div class="msgs" id="msgs"></div>
   <div id="att" class="hidden"><span id="an"></span><button id="ax">✕</button></div>
   <div id="emo" class="hidden"></div>
   <form class="bar" id="form">
    <label class="ib" style="display:flex;align-items:center;justify-content:center;cursor:pointer">📎<input type="file" id="file" hidden></label>
    <button type="button" class="ib" id="eb">😊</button>
    <input id="msg" placeholder="Xabar yozing..." autocomplete="off"><button class="ib send">➤</button>
   </form>
   <div id="jb" class="hidden"><span id="jt"></span> <button class="btn" id="jbtn" style="margin-top:.5rem">Qo'shilish</button></div>
  </div>
 </main>
</div>

<div class="ov hidden" id="ov"><div class="md">
 <div class="av" id="mav"></div>
 <label class="ib send" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">📷<input type="file" id="pic" accept="image/*" hidden></label>
 <input id="nn" placeholder="Ism"><input id="un" placeholder="Username (masalan: ozodbek_02)" autocapitalize="none"><button class="btn" id="sv">Saqlash</button>
 <div class="sec"><div id="tfs"></div><input id="p1" type="password"><button class="btn" id="tf"></button></div>
 <button class="link" id="x">Yopish</button>
 <div><button class="out" id="lo">🚪 Chiqish</button></div>
</div></div>

<div class="ov hidden" id="ct"><div class="md"><h2>👤 Kontaktlar</h2>
 <div style="display:flex;gap:.4rem"><input id="cti" placeholder="@username yoki email"><button class="btn" id="cta" style="width:auto;padding:0 1rem;margin:.3rem 0 .6rem">➕</button></div>
 <div id="ctl" style="text-align:left"></div>
 <button class="link" id="ctx">Yopish</button></div></div>

<div class="ov hidden" id="nw"><div class="md">
 <h2>Yangi guruh yoki kanal</h2>
 <select id="nt"><option value="g">👥 Guruh</option><option value="ch">📢 Kanal (ommaviy)</option></select>
 <input id="nname" placeholder="Nomi">
 <div id="nmem" style="text-align:left"></div>
 <button class="btn" id="mk">Yaratish</button>
 <button class="link" id="nx">Bekor qilish</button>
</div></div>

<script>
/* ==========================================================
   UZ Messenger — frontend + Vercel serverless API (bitta fayl)
   Backend: /api/* — pastdagi "API ROUTER" bo'limida
   ========================================================== */

const $ = s => document.querySelector(s);
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return 1; } catch(e) { alert('Xotira to\'ldi.'); return 0; } }
};

const U = () => ls.get('tg_u', []);
const M = () => ls.get('tg_m', []);
const C = () => ls.get('tg_c', []);
const uid = () => Date.now() * 1000 + Math.floor(Math.random() * 1000);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kdf = async (p, s) => {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:new TextEncoder().encode(s), iterations:150000, hash:'SHA-256' }, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
};

const EMO = '😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😢 😭 😡 👍 👎 👏 🙏 💪 🔥 ❤️ 💔 🎉 ✨ 🌹 🎁 ☕ 🍕 ⚽ 🚀 🌍 😴 🤝 👋 😱 🥰 😇 🙄 😅 🤗 🤩 😜 🫡 🥳 😏 🤯 😬 🙌 💯 ✅ ❌ ⭐ 🌙 ☀️ 🐱 🐶 🍉 🎵'.split(' ');

let me = null, peer = null, flow = {}, q = '', att = null, pfile = null, sel = null;
const uBy = id => U().find(u => u.id === id);
const sz = n => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.ceil(n/1024)+' KB';
const tm = t => new Date(t).toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' });
const dayOf = t => new Date(t).toLocaleDateString('uz-UZ', { day:'numeric', month:'long' });
const avHtml = u => u.avatar ? `<img src="${u.avatar}" alt="">` : esc((u.name||'?')[0].toUpperCase());
const dmId = (a,b) => `d${Math.min(a,b)}_${Math.max(a,b)}`;
const apk = f => /\.apk$/i.test(f.name) || f.type === 'application/vnd.android.package-archive';

/* ---------- IndexedDB (fayllar) ---------- */
const idb = new Promise(r => { try { const q = indexedDB.open('tgf', 1); q.onupgradeneeded = () => q.result.createObjectStore('f'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); } catch(e) { r(null); } });
const fput = async (k,b) => { const d = await idb; if (!d) throw 0; return new Promise((ok,no) => { const t = d.transaction('f','readwrite'); t.objectStore('f').put(b,k); t.oncomplete = ok; t.onerror = no; }); };
const fget = async k => { const d = await idb; return d ? new Promise(ok => { const r = d.transaction('f').objectStore('f').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }) : null; };
const urls = {};
const furl = async k => { if (urls[k]) return urls[k]; const b = await fget(k); return b ? (urls[k] = URL.createObjectURL(b)) : ''; };

const fileHtml = f => {
  const t = f.type || '', n = esc(f.name);
  const card = a => `<a class="fc" ${a} download="${n}">📎<span>${n}<br><small>${sz(f.size)}</small></span></a>`;
  if (f.data) return t.startsWith('image/') ? `<img src="${f.data}" alt="">` : card(`href="${f.data}"`);
  const k = `data-k="${esc(f.key)}"`;
  if (t.startsWith('image/')) return `<img ${k} alt="">`;
  if (t.startsWith('video/')) return `<video controls ${k}></video>`;
  if (t.startsWith('audio/')) return `<audio controls ${k}></audio>`;
  return card(k);
};
const hydrate = el => el.querySelectorAll('[data-k]').forEach(async n => { const u = await furl(n.dataset.k); if (u) n[n.tagName==='A'?'href':'src'] = u; });

/* ==========================================================
   API — server bilan aloqa (Vercel serverless)
   ========================================================== */
const API = {
  async request(path, opts) {
    try {
      const r = await fetch(path, opts);
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'HTTP ' + r.status); }
      return await r.json();
    } catch(e) {
      console.warn('API xatosi:', path, e.message);
      return null;
    }
  },
  users(q) { return this.request('/api/users' + (q ? '?q=' + encodeURIComponent(q) : '')); },
  findByUsername(un) { return this.request('/api/users?username=' + encodeURIComponent(un)); },
  register(data) { return this.request('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }); },
  login(email) { return this.request('/api/login?email=' + encodeURIComponent(email)); },
  messages(chat) { return this.request('/api/messages' + (chat ? '?chat=' + encodeURIComponent(chat) : '')); },
  sendMsg(m) { return this.request('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(m) }); },
  chats() { return this.request('/api/chats'); },
  createChat(c) { return this.request('/api/chats', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(c) }); },
  joinChat(id, userId) { return this.request('/api/chats', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, userId }) }); },
  posts() { return this.request('/api/posts'); },
  createPost(p) { return this.request('/api/posts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) }); },
  deletePost(id) { return this.request('/api/posts?id=' + encodeURIComponent(id), { method:'DELETE' }); },
  updateUser(u) { return this.request('/api/users', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(u) }); }
};

async function syncFromServer() {
  const [users, msgs, chats, posts] = await Promise.all([API.users(), API.messages(), API.chats(), API.posts()]);
  if (users?.users) ls.set('tg_u', users.users);
  if (msgs?.messages) ls.set('tg_m', msgs.messages);
  if (chats?.chats) ls.set('tg_c', chats.chats);
  if (posts?.posts) ls.set('tg_p', posts.posts);
}

/* ==========================================================
   AUTH
   ========================================================== */
const err = t => $('#err').textContent = t || '';
function step(n, t, s, ph, type = 'text') {
  flow.n = n;
  $('#t').textContent = t; $('#s').textContent = s;
  const f = $('#f'); f.value = ''; f.type = type; f.placeholder = ph; f.focus(); err();
  $('#re').classList.toggle('hidden', n !== 'code');
}
const toEmail = () => step('email', 'Messenger', 'Email manzilingizni kiriting, tasdiqlash kodi yuboramiz', 'Email', 'email');
function toast(h) { const t = $('#toast'); t.innerHTML = h; t.classList.remove('hidden'); clearTimeout(toast.i); toast.i = setTimeout(() => t.classList.add('hidden'), 30000); }
function sendCode() {
  flow.code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
  flow.exp = Date.now() + 3e5; flow.tries = 0;
  toast('📩 <small>Demo: server yo\'q, kod shu yerda</small><br>' + esc(flow.email) + ' uchun kod: <b>' + flow.code + '</b>');
}

$('#go').onclick = async () => {
  const v = $('#f').value.trim(), n = flow.n;
  err();
  if (!(window.crypto && crypto.subtle)) return err('Sahifa HTTPS orqali ochilishi kerak');

  if (n === 'email') {
    if (!/^\S+@\S+\.\S+$/.test(v)) return err('Email noto\'g\'ri');
    flow.email = v.toLowerCase();
    sendCode();
    step('code', 'Kodni kiriting', flow.email + ' manziliga 6 xonali kod yuborildi', '000000');

  } else if (n === 'code') {
    if (Date.now() > flow.exp) return err('Kod muddati tugadi, qayta yuboring');
    if (++flow.tries > 5) { toEmail(); return err('Juda ko\'p urinish. Qaytadan boshlang'); }
    if (v !== flow.code) return err('Kod noto\'g\'ri');
    flow.code = null;

    let u = null;
    try { const r = await API.login(flow.email); u = r?.user; } catch(e) {}
    if (!u) u = U().find(x => x.email === flow.email);
    if (u && !U().some(x => x.id === u.id)) ls.set('tg_u', [...U(), u]);
    if (u) { if (u.tfa) { flow.u = u; flow.f = 0; return step('2fa', 'Ikki bosqichli himoya', '2FA parolingizni kiriting', 'Parol', 'password'); } return login(u); }
    return step('name', 'Ismingiz', 'Profil uchun ism kiriting', 'Ism');

  } else if (n === 'name') {
    if (!v) return err('Ism kiriting');
    flow.name = v;
    return step('uname', 'Username tanlang', 'Boshqalar sizni @username orqali topadi. Ixtiyoriy', 'username');

  } else if (n === 'uname') {
    const un = v.replace(/^@/, '');
    if (un && !/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(un)) return err('Lotin harf bilan boshlanib, 3-32 belgi bo\'lsin');
    const r = await API.register({ name: flow.name, email: flow.email, username: un || null, salt: crypto.randomUUID() });
    if (!r) return err('Serverga ulanib bo\'lmadi. Qayta urinib ko\'ring.');
    if (r.error) return err(r.error);
    const u = r.user;
    ls.set('tg_u', [...U().filter(x => x.id !== u.id), u]);
    await syncFromServer();
    return login(u);

  } else if (n === '2fa') {
    if (await kdf(v, flow.u.salt) === flow.u.tfa) return login(flow.u);
    if (++flow.f >= 5) { toEmail(); return err('Juda ko\'p urinish. Qaytadan boshlang'); }
    err('Parol xato (' + flow.f + '/5)');
  }
};

    return { t:'d', name:(u?.bot?'🤖 ':'') + (u?.name || '?'), av:u?avHtml(u):'?', sub:u?(u.bot?u.email:(u.username?'@'+u.username+' · ':'')+u.email):'', mem:1, post:1, u };
  }
  const c = C().find(x => x.id === id) || { m:[] }, ch = c.t === 'ch', mem = c.m.includes(me.id);
  return { t:c.t, c, name:c.name || '?', av:c.avatar?`<img src="${c.avatar}" alt="">`:(ch?'📢':'👥'), sub:c.m.length + (ch?' obunachi':' a\'zo'), mem, post:mem && (!ch || c.o === me.id) };
}
const myIds = () => {
  const g = C().filter(c => c.m.includes(me.id)).map(c => c.id);
  const d = M().filter(x => x.c[0] === 'd' && x.c.slice(1).split('_').map(Number).includes(me.id)).map(x => x.c);
  return [...new Set([...g, ...d])];
};

function renderList() {
  const by = {}; M().forEach(x => (by[x.c] ??= []).push(x));
  const rd = ls.get('tg_r'+me.id, {});
  const ids = myIds(); if (peer && !ids.includes(peer)) ids.push(peer);
  const hit = s => !q || s.toLowerCase().includes(q);
  const rows = ids.map(id => {
    const i = info(id), a = by[id] || [];
    return { id, i, l:a.slice(-1)[0], un:a.filter(x => x.f !== me.id && x.at > (rd[id] || 0)).length };
  }).filter(r => hit(r.i.name)).sort((a,b) => (b.l?.at || 0) - (a.l?.at || 0));

  const L = $('#list'); L.innerHTML = '';
  const row = (id, av, name, pv, time, un) => {
    const d = document.createElement('div');
    d.className = 'row' + (peer === id ? ' on' : '');
    d.innerHTML = `<div class="av">${av}</div><div class="info"><div class="nm"><span>${esc(name)}</span><small>${time}</small></div><div class="pv"><span>${pv}</span>${un?`<b class="un">${un}</b>`:''}</div></div>`;
    d.onclick = () => open(id);
    L.appendChild(d);
  };
  rows.forEach(({ id, i, l, un }) => row(id, i.av, i.name, l?(l.f === me.id?'Siz: ':'') + (l.file?'📎 '+esc(l.file.name):esc(l.b)):esc(i.sub), l?tm(l.at):'', un));

  const hd = t => L.insertAdjacentHTML('beforeend', `<div class="hdr">${t}</div>`);
  const ch = C().filter(c => c.t === 'ch' && !c.m.includes(me.id) && hit(c.name));
  if (ch.length) { hd('Kanallar'); ch.forEach(c => row(c.id, c.avatar?`<img src="${c.avatar}" alt="">`:'📢', c.name, c.m.length+' obunachi', '', 0)); }

  const un = u => u.username ? '@' + u.username : u.email;
  const hitU = u => hit(u.name + u.email + (u.username ? '@' + u.username : ''));
  const rest = U().filter(u => u.id !== me.id && !ids.includes(dmId(u.id, me.id)) && hitU(u));
  const cs = rest.filter(u => isCt(u.id));
  const gl = q ? rest.filter(u => !isCt(u.id) && (u.username || '').toLowerCase().includes(q.replace(/^@/, ''))) : [];
  const urow = u => row(dmId(u.id, me.id), avHtml(u), (u.bot?'🤖 ':'') + u.name, esc(un(u)), '', 0);
  if (cs.length) { hd('Kontaktlar'); cs.forEach(urow); }
  if (gl.length) { hd('Global qidiruv'); gl.forEach(urow); }
  if (!L.children.length) L.innerHTML = '<div class="empty">Hech narsa topilmadi.<br>Qidiruvga @username yozing yoki 👤 Kontaktlar orqali qo\'shing.</div>';
}

async function addCt(s) {
  s = s.trim().replace(/^@/, '').toLowerCase();
  if (!s) return;
  // serverdan qidirish
  let found = null;
  try {
    const r = await fetch('/api/users?q=' + encodeURIComponent(s));
    const j = await r.json();
    const list = j.users || [];
    found = list.find(x => (x.username || '').toLowerCase() === s || (x.email || '').toLowerCase() === s);
  } catch(e) { console.warn(e); }
  // lokal keshdan zaxira
  if (!found) found = U().find(x => x.id !== me.id && ((x.username||'').toLowerCase() === s || (x.email||'').toLowerCase() === s));
  if (!found) return alert('Foydalanuvchi topilmadi. U ro\'yxatdan o\'tganini tekshiring.');
  if (found.id === me.id) return alert('O\'zingizni qo\'shib bo\'lmaydi');
  if (isCt(found.id)) return alert('Allaqachon kontaktlarda');
  ls.set('tg_ct' + me.id, [...cts(), found.id]);
  if (!U().some(u => u.id === found.id)) ls.set('tg_u', [...U(), found]);
  ctList(); render();
}
