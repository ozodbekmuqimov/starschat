<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UZ Messenger</title>
<style>
:root{--bg:#0e1621;--pn:#17212b;--ln:#0b121a;--ac:#2b95d6;--me:#2b5278;--mu:#7f91a4;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#e8eef4;overflow:hidden}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:inherit}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:var(--pn);border-radius:18px;padding:2rem;width:360px;max-width:100%;text-align:center}
.box .logo{font-size:3.2rem}.box h1{font-size:1.3rem;margin:.4rem 0}.box p{color:var(--mu);font-size:.88rem;margin-bottom:1rem}
.box input,.md input,.md select{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin:.3rem 0 .6rem}
.box input{text-align:center}
input:focus,select:focus{outline:0;border-color:var(--ac)}
.btn{width:100%;padding:.8rem;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.link{color:var(--ac);font-size:.82rem;margin-top:.6rem}
#err{color:#f87171;font-size:.82rem;min-height:1.1rem;margin-top:.5rem}
#toast{position:fixed;top:12px;right:12px;left:12px;max-width:340px;margin-left:auto;background:#223244;border-left:4px solid var(--ac);padding:.8rem 1rem;border-radius:10px;font-size:.88rem;z-index:60;box-shadow:0 6px 24px #0008}
#toast b{font-size:1.2rem;letter-spacing:3px}
#app{height:100%;display:flex}
.side{width:340px;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex-shrink:0}
.top{display:flex;gap:.4rem;align-items:center;padding:.7rem}
.ib{width:40px;height:40px;border-radius:50%;font-size:1.25rem;flex-shrink:0}.ib:hover{background:#223244}
.send{background:var(--ac);color:#fff}
#q{flex:1;min-width:0;padding:.55rem 1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
.list{flex:1;overflow-y:auto;position:relative}
.hdr{color:var(--ac);font-size:.75rem;font-weight:700;padding:.7rem 1rem .3rem}
.row{display:flex;gap:.7rem;padding:.65rem .8rem;align-items:center;cursor:pointer;position:relative}
.row:hover{background:#1f2c3a}.row.on{background:var(--me)}
.row .del-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#0005;font-size:.9rem;display:none;align-items:center;justify-content:center}
.row:hover .del-btn{display:flex}
.row .del-btn:hover{background:#f87171}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4fb3f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:.4rem}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mu);font-weight:400;font-size:.7rem}
.pv{color:var(--mu);font-size:.8rem;display:flex;justify-content:space-between;gap:.4rem}
.pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un{background:var(--ac);color:#fff;border-radius:999px;font-size:.7rem;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.empty{color:var(--mu);text-align:center;padding:2rem 1rem;font-size:.85rem;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.ph{margin:auto;color:var(--mu);background:#182533;padding:.4rem 1rem;border-radius:999px;font-size:.85rem}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.hd{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;background:var(--pn);border-bottom:1px solid var(--ln)}
.hd small{display:block;color:var(--mu);font-size:.75rem}
.back{display:none;font-size:1.3rem}
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.m{max-width:72%;padding:.45rem .75rem;border-radius:14px;font-size:.93rem;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:#182533;border-bottom-left-radius:4px}
.m i{font-style:normal;font-size:.65rem;color:#9fb3c8;margin-left:.6rem;float:right;margin-top:.45rem}
.m img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-bottom:.3rem}
.sn{display:block;color:#6ab7f0;font-size:.78rem}
.fc{display:flex;gap:.6rem;align-items:center;color:inherit;text-decoration:none;background:#0003;padding:.5rem;border-radius:10px;margin-bottom:.3rem;word-break:break-all}
.fc small{color:#9fb3c8}
.big{font-size:2.2rem;line-height:1.2}
.day{align-self:center;background:#182533;color:var(--mu);font-size:.72rem;padding:.15rem .7rem;border-radius:999px;margin:.4rem 0}
.bar{display:flex;gap:.3rem;padding:.6rem .8rem;background:var(--pn);align-items:center}
#msg{flex:1;min-width:0;padding:.7rem 1.1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
#att{padding:.4rem 1rem;background:var(--pn);font-size:.82rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln)}
#jb{padding:.8rem;background:var(--pn);text-align:center;color:var(--mu);font-size:.88rem}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;padding:.5rem;background:var(--pn);border-top:1px solid var(--ln);max-height:190px;overflow-y:auto}
#emo button{font-size:1.5rem;padding:.25rem;border-radius:8px}#emo button:hover{background:#223244}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:1rem}
.md{background:var(--pn);border-radius:16px;padding:1.5rem;width:380px;max-width:100%;max-height:90%;overflow-y:auto;text-align:center}
.md h2{font-size:1.1rem;color:var(--ac);margin-bottom:.6rem}
.md .av{width:90px;height:90px;font-size:2rem;margin:0 auto .6rem}
.sec{border-top:1px solid var(--ln);margin-top:1rem;padding-top:1rem;font-size:.85rem;color:var(--mu)}
.out{margin-top:.8rem;color:#f87171;font-weight:600}
.ck{display:flex;gap:.6rem;align-items:center;padding:.35rem 0;text-align:left;font-size:.9rem}
.ck input{width:auto;margin:0}
.navt{display:flex;border-bottom:1px solid var(--ln)}.nt{flex:1;padding:.6rem;color:var(--mu);font-size:.85rem;border-bottom:2px solid transparent}.nt.on{color:var(--ac);border-color:var(--ac)}
.lg{width:34px;height:34px;border-radius:50%;flex-shrink:0}
#feed{flex:1;display:flex;flex-direction:column;min-height:0}.fbody{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem;align-items:center}.fbody>*{width:100%;max-width:600px}#fl{display:flex;flex-direction:column;gap:1rem}
.pc{background:var(--pn);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}.pc textarea{background:transparent;border:0;color:inherit;resize:none;min-height:56px;outline:0;font:inherit}.pc img,.pc video,.m video{max-width:100%;border-radius:10px}.m audio{max-width:100%}
.ph2{display:flex;gap:.7rem;align-items:center}.ph2 small{display:block;color:var(--mu);font-size:.72rem}.pb{white-space:pre-wrap;word-wrap:break-word}.pa{display:flex;gap:.8rem;align-items:center;color:var(--mu);font-size:.85rem}
@supports(height:100dvh){html,body,#app,#auth{height:100dvh}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.box{animation:up .4s}#app{animation:fd .4s}.ov{animation:fd .2s}.ov>.md{animation:pop .22s}#chat,#feed{animation:sl .25s}.msgs>.m:last-child,.pc{animation:up .25s}
#pin{padding:.4rem 1rem;background:var(--pn);border-bottom:1px solid var(--ln);border-left:3px solid var(--ac);font-size:.82rem;cursor:pointer;display:flex;gap:.5rem;align-items:center}#pin span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pin small{color:var(--mu)}
#sel{display:flex;justify-content:space-between;align-items:center;padding:.4rem 1rem;background:#223244}.m.sel{outline:2px solid var(--ac)}.pm{float:left;margin-right:.3rem;font-size:.7rem}
#rbar{gap:.8rem;align-items:center}#pav,#pn{cursor:pointer}
.md textarea{width:100%;min-height:150px;padding:.7rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin:.3rem 0 .6rem;font:12px/1.4 ui-monospace,Consolas,monospace;color:#c9d6e3;resize:vertical}.md .ck button{margin-left:auto}
#delov .md{width:340px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:800px){.side{width:100%}.back{display:block}.in-chat .side{display:none}#app:not(.in-chat) .main{display:none}#app.feed .side{display:none}#app.feed .main{display:flex!important}.m{max-width:86%}input,textarea{font-size:16px!important}.box{padding:1.5rem}.row .del-btn{display:flex}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3948;border-radius:3px}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>

<div id="auth"><div class="box">
 <div class="logo">💬</div><h1 id="t">Messenger</h1><p id="s">Email manzilingizni kiriting</p>
 <input id="f" autocomplete="off">
 <button class="btn" id="go">Davom etish</button>
 <button class="link hidden" id="re">Kodni qayta yuborish</button>
 <div id="err"></div>
</div></div>

<div id="app" class="hidden">
 <aside class="side">
  <div class="top"><button class="ib" id="menu" title="Profil">☰</button><input id="q" placeholder="Qidirish (@username / email)"><button class="ib" id="new" title="Yangi guruh/kanal">✏️</button></div>
  <div class="navt"><button class="nt on" data-v="chats">💬 Chatlar</button><button class="nt" data-v="feed">📰 Postlar</button><button class="nt" id="ctb">👤 Kontaktlar</button></div><div class="list" id="list"></div>
 </aside>
 <main class="main">
  <div class="ph" id="ph">Suhbatni tanlang</div>
  <div class="hidden" id="feed"><div class="hd"><button class="back" id="fb">←</button><b>📰 Postlar</b></div><div class="fbody"><div class="pc"><textarea id="pt" placeholder="Nima yangilik?"></textarea><div class="pa"><label class="ib" style="display:flex;align-items:center;justify-content:center;cursor:pointer">📎<input type="file" id="pfile" hidden></label><span id="pfn"></span><button class="btn" id="pp" style="width:auto;padding:.5rem 1.2rem;margin-left:auto">Post</button></div></div><div id="fl"></div></div></div>
  <div class="hidden" id="chat">
   <div class="hd"><button class="back" id="back">←</button><div class="av" id="pav"></div><div style="flex:1"><b id="pn"></b><small id="ps"></small></div><button class="ib" id="chdel" title="Chatni o'chirish">🗑</button></div>
   <div id="pin" class="hidden"></div><div id="sel" class="hidden" style="gap:.35rem;flex-wrap:wrap"><button class="btn" id="selp" style="width:auto;padding:.4rem .7rem">📌 Qadash</button><button class="ib" id="selreply" title="Javob berish">↩️</button><button class="ib" id="seledit" title="Tahrirlash">✏️</button><button class="ib" id="selfwd" title="Uzatish">➡️</button><button class="ib" id="seldel" title="O'chirish">🗑</button><button class="ib" id="selx">✕</button></div><div id="replydraft" class="hidden" style="padding:.4rem .8rem;background:#223244;display:flex;gap:.5rem;align-items:center"><span id="replytxt" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><button id="replycancel">✕</button></div><div class="msgs" id="msgs"></div>
   <div id="att" class="hidden"><span id="an"></span><button id="ax">✕</button></div>
   <div id="emo" class="hidden"></div>
   <form class="bar" id="form">
    <label class="ib" style="display:flex;align-items:center;justify-content:center;cursor:pointer">📎<input type="file" id="file" hidden></label>
    <button type="button" class="ib" id="eb">😊</button>
    <input id="msg" placeholder="Xabar yozing..." autocomplete="off"><button class="ib send">➤</button>
   </form>
   <div id="jb" class="hidden"><span id="jt"></span> <button class="btn" id="jbtn" style="margin-top:.5rem">Qo'shilish</button></div>
  </div>
 </main>
</div>

<div class="ov hidden" id="ov"><div class="md">
 <div class="av" id="mav"></div>
 <label class="ib send" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">📷<input type="file" id="pic" accept="image/*" hidden></label>
 <input id="nn" placeholder="Ism"><input id="un" placeholder="Username (masalan: ozodbek_02)" autocapitalize="none"><button class="btn" id="sv">Saqlash</button>
 <div class="sec"><div id="tfs"></div><input id="p1" type="password"><button class="btn" id="tf"></button></div>
 <button class="link" id="x">Yopish</button>
 <div><button class="out" id="lo">🚪 Chiqish</button></div>
</div></div>

<div class="ov hidden" id="ct"><div class="md"><h2>👤 Kontaktlar</h2>
 <div style="display:flex;gap:.4rem"><input id="cti" placeholder="@username yoki email"><button class="btn" id="cta" style="width:auto;padding:0 1rem;margin:.3rem 0 .6rem">➕</button></div>
 <div id="ctl" style="text-align:left"></div>
 <button class="link" id="ctx">Yopish</button></div></div>

<div class="ov hidden" id="ci"><div class="md">
 <div class="av" id="cav"></div>
 <label class="ib send" id="cpl" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">📷<input type="file" id="cpic" accept="image/*" hidden></label>
 <input id="cname" placeholder="Nomi"><div id="cinfo" style="color:var(--mu);font-size:.8rem;margin-bottom:.6rem"></div>
 <button class="btn hidden" id="cadd" style="margin-bottom:.5rem"></button><button class="btn" id="csv">Saqlash</button>
 <div class="sec hidden" id="cbot" style="text-align:left"><b>🤖 Bot sozlamalari</b><div style="font-size:.75rem;word-break:break-all;margin:.3rem 0">Token: <span id="ctok"></span></div>
  <div style="display:flex;gap:.4rem"><input id="bc1" placeholder="/buyruq"><input id="bc2" placeholder="Javob matni"></div>
  <button class="btn" id="bca">➕ Buyruq qo'shish</button><div id="bcl"></div>
  <div style="margin-top:.8rem">💻 Bot kodi (JS yoki Python)</div>
  <div style="font-size:.72rem;color:var(--mu);margin:.2rem 0 .4rem">Birinchi qator: <code>//lang=javascript</code> yoki <code>//lang=python</code>. Python Pyodide orqali ishlaydi (CDN, ~10MB).</div>
  <textarea id="bcode" spellcheck="false" placeholder="//lang=javascript
on('/start', c => reply('Salom, ' + c.name + '!'));
on('/hi', () => reply('Assalomu alaykum'));
onText(t => reply('Siz yozdingiz: ' + t));

// yoki:
//lang=python
def on_start(ctx):
    return f\"Salom, {ctx['name']}!\"
"></textarea>
  <button class="btn" id="bcs">Kodni saqlash</button></div>
 <button class="link" id="cx">Yopish</button>
</div></div>

<div class="ov hidden" id="nw"><div class="md">
 <h2>Yangi guruh yoki kanal</h2>
 <select id="nt"><option value="g">👥 Guruh</option><option value="ch">📢 Kanal (ommaviy)</option></select>
 <input id="nname" placeholder="Nomi">
 <div id="nmem" style="text-align:left"></div>
 <button class="btn" id="mk">Yaratish</button>
 <button class="link" id="nx">Bekor qilish</button>
</div></div>

<div class="ov hidden" id="delov"><div class="md">
 <h2>🗑 Chatni o'chirish</h2>
 <p id="delmsg" style="color:var(--mu);font-size:.85rem;margin:.5rem 0"></p>
 <button class="btn" id="delyes" style="background:#f87171">Ha, o'chirish</button>
 <button class="link" id="delno">Bekor qilish</button>
</div></div>

<script>
/* ==========================================================
   UZ Messenger — to'liq bitta faylda
   Yangiliklar:
   + Chatni o'chirish (listdagi 🗑, chat sarlavhasidagi 🗑)
   + Bot komandalari kengaytirildi (/reset, /help, /id va h.k.)
   + Bot kodi JS + Python (Pyodide) qo'llab-quvvatlaydi
   ========================================================== */

const $ = s => document.querySelector(s);
const ls = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return 1; }catch(e){ alert('Xotira to\'ldi.'); return 0; } }
};
const U = () => ls.get('tg_u', []);
const M = () => ls.get('tg_m', []);
const C = () => ls.get('tg_c', []);
const uid = () => Date.now()*1000 + Math.floor(Math.random()*1000);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kdf = async (p,s) => {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(s), iterations:150000, hash:'SHA-256'}, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
};
const EMO = '😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😢 😭 😡 👍 👎 👏 🙏 💪 🔥 ❤️ 💔 🎉 ✨ 🌹 🎁 ☕ 🍕 ⚽ 🚀 🌍 😴 🤝 👋 😱 🥰 😇 🙄 😅 🤗 🤩 😜 🫡 🥳 😏 🤯 😬 🙌 💯 ✅ ❌ ⭐ 🌙 ☀️ 🐱 🐶 🍉 🎵'.split(' ');
let me = null, peer = null, flow = {}, q = '', att = null, pfile = null, sel = null, replyTo = null;
const uBy = id => U().find(u => u.id === id);
const sz = n => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.ceil(n/1024)+' KB';
const tm = t => new Date(t).toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' });
const dayOf = t => new Date(t).toLocaleDateString('uz-UZ', { day:'numeric', month:'long' });
const avHtml = u => u.avatar ? `<img src="${u.avatar}" alt="">` : esc((u.name||'?')[0].toUpperCase());
const dmId = (a,b) => `d${Math.min(a,b)}_${Math.max(a,b)}`;
const apk = f => /\.apk$/i.test(f.name) || f.type === 'application/vnd.android.package-archive';

/* ---------- IndexedDB ---------- */
const idb = new Promise(r => { try { const q = indexedDB.open('tgf', 1); q.onupgradeneeded = () => q.result.createObjectStore('f'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); } catch(e) { r(null); } });
const fput = async (k,b) => { const d = await idb; if (!d) throw 0; return new Promise((ok,no) => { const t = d.transaction('f','readwrite'); t.objectStore('f').put(b,k); t.oncomplete = ok; t.onerror = no; }); };
const fget = async k => { const d = await idb; return d ? new Promise(ok => { const r = d.transaction('f').objectStore('f').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }) : null; };
const fdel = async k => { const d = await idb; if (!d) return; return new Promise(ok => { const t = d.transaction('f','readwrite'); t.objectStore('f').delete(k); t.oncomplete = ok; t.onerror = ok; }); };
const urls = {};
const furl = async k => { if (urls[k]) return urls[k]; const b = await fget(k); return b ? (urls[k] = URL.createObjectURL(b)) : ''; };

const fileHtml = f => {
  const t = f.type || '', n = esc(f.name);
  const card = a => `<a class="fc" ${a} download="${n}">📎<span>${n}<br><small>${sz(f.size)}</small></span></a>`;
  if (f.data) return t.startsWith('image/') ? `<img src="${f.data}" alt="">` : card(`href="${f.data}"`);
  const k = `data-k="${esc(f.key)}"`;
  if (t.startsWith('image/')) return `<img ${k} alt="">`;
  if (t.startsWith('video/')) return `<video controls ${k}></video>`;
  if (t.startsWith('audio/')) return `<audio controls ${k}></audio>`;
  return card(k);
};
const hydrate = el => el.querySelectorAll('[data-k]').forEach(async n => { const u = await furl(n.dataset.k); if (u) n[n.tagName==='A'?'href':'src'] = u; });

/* ==========================================================
   API — Vercel serverless
   ========================================================== */
const API = {
  async req(path, opts) {
    try {
      const r = await fetch(path, opts);
      if (!r.ok) return null;
      return await r.json();
    } catch(e) { return null; }
  },
  users(q) { return this.req('/api/users' + (q ? '?q=' + encodeURIComponent(q) : '')); },
  register(d) { return this.req('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d) }); },
  login(email) { return this.req('/api/login?email=' + encodeURIComponent(email)); },
  messages(chat) { return this.req('/api/messages' + (chat ? '?chat=' + encodeURIComponent(chat) : '')); },
  sendMsg(m) { return this.req('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(m) }); },
  deleteMsg(id) { return this.req('/api/messages?id=' + encodeURIComponent(id), { method:'DELETE' }); },

/* ==========================================================
   PYODIDE — Python kod bajarish (lazy load)
   ========================================================== */
let pyodideReady = null;
async function getPyodide() {
  if (pyodideReady) return pyodideReady;
  pyodideReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
    s.onload = async () => {
      try { resolve(await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' })); }
      catch(e) { reject(e); }
    };
    s.onerror = () => reject(new Error('Pyodide yuklanmadi'));
    document.head.appendChild(s);
  });
  return pyodideReady;
}

async function runPython(code, ctx) {
  const py = await getPyodide();
  const json = JSON.stringify(ctx);
  const wrapped = `
import json
ctx = json.loads(${JSON.stringify(json)})
_out = []
def reply(x):
    _out.append(str(x))
${code}
def _dispatch():
    cmd = ctx.get('cmd','')
    if 'on_start' in globals() and cmd == '/start':
        r = on_start(ctx)
        if r is not None: _out.append(str(r))
    elif 'on_text' in globals():
        r = on_text(ctx.get('text',''), ctx)
        if r is not None: _out.append(str(r))
_dispatch()
json.dumps(_out)
`;
  const result = await py.runPythonAsync(wrapped);
  return JSON.parse(result);
}

/* ==========================================================
   JS bot sandbox (iframe)
   ========================================================== */
function runBot(code, ctx) {
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.sandbox = 'allow-scripts';
    f.style.display = 'none';
    let done = 0;
    const fin = o => { if (done) return; done = 1; removeEventListener('message', h); f.remove(); res(o); };
    const h = e => { if (e.source === f.contentWindow) fin(e.data); };
    addEventListener('message', h);
    f.srcdoc = `<script>
addEventListener("message", async e => {
  const {code, ctx} = e.data, H = {}, out = [];
  let T = null;
  try {
    new Function("on","onText","reply","ctx",code)(
      (c, fn) => { H[c.toLowerCase()] = fn; },
      fn => { T = fn; },
      t => out.push(String(t)),
      ctx
    );
    const fn = H[ctx.cmd] || (ctx.cmd[0] !== '/' ? T : null);
    if (fn) await fn(ctx.cmd[0] === '/' ? ctx : ctx.text, ctx);
    parent.postMessage({out, hit: !!fn}, "*");
  } catch(x) { parent.postMessage({err: String(x)}, "*"); }
});
<\/script>`;
    f.onload = () => f.contentWindow.postMessage({code, ctx}, '*');
    document.body.appendChild(f);
    setTimeout(() => fin({err:'⏱ Kod 5 soniyada javob bermadi'}), 5000);
  });
}

/* ==========================================================
   BOT DISPATCHER — JS yoki Python
   ========================================================== */
async function runBotCode(code, ctx) {
  const firstLine = (code.split('\n')[0] || '').toLowerCase();
  const isPython = firstLine.includes('lang=python') || firstLine.includes('#lang=python');
  if (isPython) {
    try {
      const out = await runPython(code, ctx);
      return { out, hit: out.length > 0 };
    } catch(e) {
      return { err: String(e), hit: true };
    }
  }
  // JS default
  return await runBot(code, ctx);
}

/* ---------- Ovoz / video ---------- */
async function record(kind) {
  if (rec || !peer || !info(peer).post) return;
  try {
    const s = await navigator.mediaDevices.getUserMedia(kind === 'v' ? { video:{ facingMode:'user', width:480, height:480 }, audio:true } : { audio:true });
    const ch = [], mr = new MediaRecorder(s);
    rec = { kind, send:true, t:Date.now() };
    mr.ondataavailable = e => e.data.size && ch.push(e.data);
    mr.onstop = async () => {
      clearInterval(rec.iv);
      s.getTracks().forEach(t => t.stop());
      $('#rbar').classList.add('hidden');
      $('#rpv').classList.add('hidden');
      const r = rec; rec = null; bar();
      if (!r.send || !ch.length) return;
      const type = (mr.mimeType || '').split(';')[0] || (kind === 'v' ? 'video/webm' : 'audio/webm');
      const b = new Blob(ch, {type}), key = 'f' + uid();
      try { await fput(key, b); } catch(x) { return alert(`Saqlab bo'lmadi`); }
      push({ name:(kind === 'v' ? 'dumaloq-video' : 'ovoz') + '.webm', type, size:b.size, key, rec:kind });
    };
    rec.stop = send => { rec.send = send; mr.state !== 'inactive' && mr.stop(); };
    if (kind === 'v') { const v = $('#rpv'); v.srcObject = s; v.classList.remove('hidden'); v.play().catch(()=>0); }
    $('#form').classList.add('hidden');
    $('#rbar').classList.remove('hidden');
    $('#rt').textContent = '0:00';
    const lim = kind === 'v' ? 60 : 600;
    rec.iv = setInterval(() => {
      const n = Math.floor((Date.now()-rec.t)/1000);
      $('#rt').textContent = Math.floor(n/60) + ':' + String(n%60).padStart(2,'0');
      if (n >= lim) rec.stop(true);
    }, 300);
    mr.start();
  } catch(e) { alert(`Mikrofon/kamera ruxsati berilmadi yoki brauzer qo'llamaydi`); }
}

/* ==========================================================
   BOT — ASOSIY DISPATCHER (kengaytirilgan komandalar)
   ========================================================== */
const BOT_CMDS_HELP = `/start - botni ishga tushirish
/reset - botni qayta ishga tushirish
/help - yordam
/info - bot haqida
/id - sizning ID raqamingiz
/uid - chat ID
/time - hozirgi vaqt
/date - hozirgi sana
/random - tasodifiy son (1-100)
/math <ifoda> - matematik hisoblash (2+2*3)
/reverse <matn> - matnni teskari qiladi
/upper <matn> - katta harflarga
/lower <matn> - kichik harflarga
/len <matn> - belgilar soni
/count <matn> - so'zlar soni
/echo <matn> - matnni qaytaradi
/me - profilingiz
/version - messenger versiyasi
/clear - chatni tozalash`;

function botCmdHandler(c, t, u) {
  const a = t.split(/\s+/);
  const cmd = a[0].toLowerCase();
  const arg = a.slice(1).join(' ');
  const r = x => say(u.id, c, x);

  switch (cmd) {
    case '/start':
      return r(`Salom, ${me.name}! 👋\nMen ${u.name} botiman.\n\n${BOT_CMDS_HELP}`);
    case '/reset':
      resetStarted(u.id);
      return r('♻️ Bot qayta ishga tushirildi. /start yoki boshqa komanda yuboring.');
    case '/help':
      return r(BOT_CMDS_HELP);
    case '/info':
      return r(`🤖 Bot: ${u.name}\nID: ${u.id}\nYaratuvchi: ${uBy(u.owner)?.name || '—'}\nKod: ${u.code ? '✅ bor' : '—'}\nBuyruqlar: ${Object.keys(u.cmds||{}).join(', ') || '—'}`);
    case '/id':
      return r(`👤 Sizning ID: ${me.id}\n📧 Email: ${me.email}\n🔗 Username: ${me.username ? '@'+me.username : '—'}`);
    case '/uid':
      return r(`💬 Chat ID: ${c}`);
    case '/time':
      return r(`🕐 Vaqt: ${new Date().toLocaleTimeString('uz-UZ')}`);
    case '/date':
      return r(`📅 Sana: ${new Date().toLocaleDateString('uz-UZ', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}`);
    case '/random':
      return r(`🎲 Tasodifiy son: ${Math.floor(Math.random()*100)+1}`);
    case '/math':
      if (!arg) return r('Namuna: /math 2+2*3');
      try {
        if (!/^[\d\s+\-*/().%]+$/.test(arg)) return r('Faqat raqam va + - * / ( ) ishlatilsin');
        const result = Function('"use strict"; return (' + arg + ')')();
        return r(`🧮 ${arg} = ${result}`);
      } catch(e) { return r('Xato: ' + e.message); }
    case '/reverse':
      return arg ? r(arg.split('').reverse().join('')) : r('Namuna: /reverse salom');
    case '/upper':
      return arg ? r(arg.toUpperCase()) : r('Namuna: /upper salom');
    case '/lower':
      return arg ? r(arg.toLowerCase()) : r('Namuna: /lower SALOM');
    case '/len':
      return arg ? r(`📏 ${arg.length} belgi`) : r('Namuna: /len salom');
    case '/count':
      return arg ? r(`📝 ${arg.trim().split(/\s+/).length} so'z`) : r('Namuna: /count salom dunyo');
    case '/echo':
      return arg ? r(arg) : r('Namuna: /echo salom');
    case '/me':
      return r(`👤 ${me.name}\n📧 ${me.email}\n🔗 ${me.username ? '@'+me.username : '—'}\n🆔 ${me.id}`);
    case '/version':
      return r('📦 UZ Messenger v1.0.0');
    case '/clear':
      const before = M().length;
      ls.set('tg_m', M().filter(m => m.c !== c));
      return r(`🧹 ${before - M().length} ta xabar o'chirildi.`);
    default:
      return null;
  }
}

function say(bot, c, b) {
  setTimeout(() => {
    const m = { id:uid(), c, f:bot, b, file:null, at:Date.now() };
    ls.set('tg_m', [...M(), m]);
    API.sendMsg(m);
    render();
  }, 350);
}

async function botTick(c, t) {
  const u = peerUser(c);
  if (!u?.bot || !t) return;

  // 1) Foydalanuvchi kodi bo'lsa — birinchi navbatda
  if (u.code) {
    const k = t.split(/\s+/)[0].toLowerCase();
    const r = await runBotCode(u.code, { cmd:k, text:t, name:me.name, id:me.id });
    if (r.err) return say(u.id, c, '⚠️ Bot kodi xatosi: ' + r.err);
    if (r.hit && r.out?.length) return r.out.forEach(x => say(u.id, c, x));
  }

  // 2) BotFather — maxsus
  if (u.id === 1) return bf(c, t);

  // 3) Standart komandalar
  const handled = botCmdHandler(c, t, u);
  if (handled) return;

  // 4) cmds dan izlash
  const cm = u.cmds || {};
  const k = t.split(/\s+/)[0].toLowerCase();
  const ks = Object.keys(cm).filter(x => x !== '/*').join(' ');
  say(u.id, c, cm[k] || (k === '/start' ? `Salom! Men ${u.name} botiman.` + (ks?'\nBuyruqlar: '+ks:'') : cm['/*'] || 'Tushunmadim. ' + (ks?'Buyruqlar: '+ks:'Egasi hali buyruq qo\'shmagan.')));
}

/* ---------- BotFather ---------- */
function bf(c, t) {
  const K = 'tg_bf'+me.id, S = ls.get(K, {}), r = x => say(1, c, x);
  const a = t.split(/\s+/), cmd = a[0].toLowerCase();
  const bots = () => U().filter(u => u.bot && u.owner === me.id);
  const own = n => bots().find(b => b.username.toLowerCase() === (n||'').replace('@','').toLowerCase());

  if (cmd === '/cancel') { ls.set(K, {}); return r('Bekor qilindi.'); }
  if (S.st === 'name' && cmd[0] !== '/') { ls.set(K, {st:'user', name:t}); return r('Yaxshi. Endi bot uchun username tanlang. U "bot" bilan tugashi kerak, masalan: UZ_news_bot'); }
  if (S.st === 'user' && cmd[0] !== '/') {
    const un = t.replace('@','');
    if (!/^[A-Za-z0-9_]{3,29}bot$/i.test(un)) return r('Username "bot" bilan tugashi va faqat lotin harf, raqam, _ bo\'lishi kerak.');
    if (U().some(u => (u.username||'').toLowerCase() === un.toLowerCase())) return r('Bu username band.');
    const id = uid(), tok = id+':'+[...crypto.getRandomValues(new Uint8Array(18))].map(x => (x%36).toString(36)).join('');
    const botUser = { id, name:S.name, email:'@'+un, username:un, bot:true, owner:me.id, token:tok, avatar:null, cmds:{} };
    ls.set('tg_u', [...U(), botUser]);
    API.updateUser(botUser);
    ls.set(K, {});
    return r(`✅ Bot yaratildi: @${un}\nToken: ${tok}\n\nKod yozish uchun bot profilini oching yoki BotFather orqali:\n/setcmd ${un} /salom Assalomu alaykum!\n\n(Kod yozish uchun bot sarlavhasini bosing)`);
  }
  if (cmd === '/newbot') { ls.set(K, {st:'name'}); return r('Yangi bot yaratamiz. Botga nom bering:'); }
  if (cmd === '/mybots') return r(bots().map(b => '@'+b.username).join('\n') || 'Sizda bot yo\'q. /newbot');
  if (cmd === '/token') { const b = own(a[1]); return r(b ? b.token : 'Bot topilmadi. Namuna: /token mybot'); }
  if (cmd === '/setcmd') {
    const b = own(a[1]), k = (a[2]||'').toLowerCase(), v = a.slice(3).join(' ');
    if (!b || k[0] !== '/' || !v) return r('Namuna: /setcmd mybot /salom Assalomu alaykum!\nStandart javob: /setcmd mybot /* Javob matni');
    const us = U(), i = us.findIndex(u => u.id === b.id);
    us[i].cmds = {...us[i].cmds, [k]:v};
    ls.set('tg_u', us);
    API.updateUser({id:b.id, cmds:us[i].cmds});
    return r('✅ ' + k + ' qo\'shildi');
  }
  if (cmd === '/delbot') {
    const b = own(a[1]);
    if (!b) return r('Bot topilmadi. Namuna: /delbot mybot');
    ls.set('tg_u', U().filter(u => u.id !== b.id));
    return r('🗑 O\'chirildi');
  }
  r('Men BotFather, bot yaratuvchiman.\n/newbot: yangi bot\n/mybots: botlarim\n/setcmd: buyruq qo\'shish\n/token: tokenni ko\'rish\n/delbot: botni o\'chirish\n/cancel: bekor qilish');
}

}

   AUTH
   ========================================================== */
const err = t => $('#err').textContent = t || '';
function step(n, t, s, ph, type = 'text') {
  flow.n = n;
  $('#t').textContent = t; $('#s').textContent = s;
  const f = $('#f'); f.value = ''; f.type = type; f.placeholder = ph; f.focus(); err();
  $('#re').classList.toggle('hidden', n !== 'code');
}
const toEmail = () => step('email', 'Messenger', 'Email manzilingizni kiriting, tasdiqlash kodi yuboramiz', 'Email', 'email');
function toast(h) { const t = $('#toast'); t.innerHTML = h; t.classList.remove('hidden'); clearTimeout(toast.i); toast.i = setTimeout(() => t.classList.add('hidden'), 30000); }
function sendCode() {
  flow.code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
  flow.exp = Date.now() + 3e5; flow.tries = 0;
  toast('📩 <small>Demo: server yo\'q, kod shu yerda</small><br>' + esc(flow.email) + ' uchun kod: <b>' + flow.code + '</b>');
}

$('#go').onclick = async () => {
  const v = $('#f').value.trim(), n = flow.n;
  err();
  if (!(window.crypto && crypto.subtle)) return err('Sahifa HTTPS orqali ochilishi kerak');

  if (n === 'email') {
    if (!/^\S+@\S+\.\S+$/.test(v)) return err('Email noto\'g\'ri');
    flow.email = v.toLowerCase();
    sendCode();
    step('code', 'Kodni kiriting', flow.email + ' manziliga 6 xonali kod yuborildi', '000000');

  } else if (n === 'code') {
    if (Date.now() > flow.exp) return err('Kod muddati tugadi, qayta yuboring');
    if (++flow.tries > 5) { toEmail(); return err('Juda ko\'p urinish. Qaytadan boshlang'); }
    if (v !== flow.code) return err('Kod noto\'g\'ri');
    flow.code = null;
    let u = null;
    const r = await API.login(flow.email);
    if (r?.user) u = r.user;
    if (!u) u = U().find(x => x.email === flow.email);
    if (u && !U().some(x => x.id === u.id)) ls.set('tg_u', [...U(), u]);
    if (!u) return step('name', 'Ismingiz', 'Profil uchun ism kiriting', 'Ism');
    if (u.tfa) { flow.u = u; flow.f = 0; return step('2fa', 'Ikki bosqichli himoya', '2FA parolingizni kiriting', 'Parol', 'password'); }
    return login(u);

  } else if (n === 'name') {
    if (!v) return err('Ism kiriting');
    flow.name = v;
    return step('uname', 'Username tanlang', 'Boshqalar sizni @username orqali topadi. Ixtiyoriy', 'username');

  } else if (n === 'uname') {
    const un = v.replace(/^@/, '');
    if (un && !/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(un)) return err('Lotin harf bilan boshlanib, 3-32 belgi bo\'lsin');
    const r = await API.register({ name: flow.name, email: flow.email, username: un || null, salt: crypto.randomUUID() });
    if (r && r.error) return err(r.error);
    let u = r?.user;
    if (!u) {
      if (un && U().some(x => (x.username||'').toLowerCase() === un.toLowerCase())) return err('Bu username band');
      u = { id:uid(), name:flow.name, email:flow.email, username:un||null, avatar:null, tfa:null, salt:crypto.randomUUID() };
    }
    ls.set('tg_u', [...U().filter(x => x.id !== u.id), u]);
    await syncFromServer();
    return login(u);

  } else if (n === '2fa') {
    if (await kdf(v, flow.u.salt) === flow.u.tfa) return login(flow.u);
    if (++flow.f >= 5) { toEmail(); return err('Juda ko\'p urinish. Qaytadan boshlang'); }
    err('Parol xato (' + flow.f + '/5)');
  }
};
$('#f').addEventListener('keydown', e => e.key === 'Enter' && $('#go').click());
$('#re').onclick = () => { sendCode(); err(); };

function info(id) {
  if (id[0] === 'd') {
    const o = +id.slice(1).split('_').find(x => +x !== me.id), u = uBy(o);
    return { t:'d', name:(u?.bot?'🤖 ':'') + (u?.name || '?'), av:u?avHtml(u):'?', sub:u?(u.bot?u.email:(u.username?'@'+u.username+' · ':'')+u.email):'', mem:1, post:1, u };
  }
  const c = C().find(x => x.id === id) || { m:[] }, ch = c.t === 'ch', mem = c.m.includes(me.id);
  return { t:c.t, c, name:c.name || '?', av:c.avatar?`<img src="${c.avatar}" alt="">`:(ch?'📢':'👥'), sub:c.m.length + (ch?' obunachi':' a\'zo'), mem, post:mem && (!ch || c.o === me.id) };
}
const myIds = () => {
  const g = C().filter(c => c.m.includes(me.id)).map(c => c.id);
  const d = M().filter(x => x.c[0] === 'd' && x.c.slice(1).split('_').map(Number).includes(me.id)).map(x => x.c);
  return [...new Set([...g, ...d])];
};
const markRead = () => { const r = ls.get('tg_r'+me.id, {}); r[peer] = Date.now(); ls.set('tg_r'+me.id, r); };
function render() {
  if (peer) { markRead(); renderMsgs(); bar(); renderPin(); }
  renderList();
}

function renderList() {
  const by = {}; M().forEach(x => (by[x.c] ??= []).push(x));
  const rd = ls.get('tg_r'+me.id, {});
  const ids = myIds(); if (peer && !ids.includes(peer)) ids.push(peer);
  const hit = s => !q || s.toLowerCase().includes(q);
  const rows = ids.map(id => {
    const i = info(id), a = by[id] || [];
    return { id, i, l:a.slice(-1)[0], un:a.filter(x => x.f !== me.id && x.at > (rd[id] || 0)).length };
  }).filter(r => hit(r.i.name)).sort((a,b) => (b.l?.at || 0) - (a.l?.at || 0));

  const L = $('#list'); L.innerHTML = '';
  const row = (id, av, name, pv, time, un) => {
    const d = document.createElement('div');
    d.className = 'row' + (peer === id ? ' on' : '');
    d.innerHTML = `<div class="av">${av}</div><div class="info"><div class="nm"><span>${esc(name)}</span><small>${time}</small></div><div class="pv"><span>${pv}</span>${un?`<b class="un">${un}</b>`:''}</div></div><button class="del-btn" data-del="${id}" title="O'chirish">🗑</button>`;
    d.querySelector('.av').onclick = () => open(id);
    d.querySelector('.info').onclick = () => open(id);
    d.querySelector('.del-btn').onclick = e => { e.stopPropagation(); askDeleteChat(id); };
    L.appendChild(d);
  };
  rows.forEach(({ id, i, l, un }) => row(id, i.av, i.name, l?(l.f === me.id?'Siz: ':'') + (l.file?'📎 '+esc(l.file.name):esc(l.b)):esc(i.sub), l?tm(l.at):'', un));

  const hd = t => L.insertAdjacentHTML('beforeend', `<div class="hdr">${t}</div>`);
  const ch = C().filter(c => c.t === 'ch' && !c.m.includes(me.id) && hit(c.name));
  if (ch.length) { hd('Kanallar'); ch.forEach(c => row(c.id, c.avatar?`<img src="${c.avatar}" alt="">`:'📢', c.name, c.m.length+' obunachi', '', 0)); }

  const un = u => u.username ? '@' + u.username : u.email;
  const hitU = u => hit(u.name + u.email + (u.username ? '@' + u.username : ''));
  const rest = U().filter(u => u.id !== me.id && !ids.includes(dmId(u.id, me.id)) && hitU(u));
  const cs = rest.filter(u => isCt(u.id));
  const gl = q ? rest.filter(u => !isCt(u.id) && (u.username || '').toLowerCase().includes(q.replace(/^@/, ''))) : [];
  const urow = u => row(dmId(u.id, me.id), avHtml(u), (u.bot?'🤖 ':'') + u.name, esc(un(u)), '', 0);
  if (cs.length) { hd('Kontaktlar'); cs.forEach(urow); }
  if (gl.length) { hd('Global qidiruv'); gl.forEach(urow); }
  if (!L.children.length) L.innerHTML = '<div class="empty">Hech narsa topilmadi.<br>Qidiruvga @username yozing yoki 👤 Kontaktlar orqali qo\'shing.</div>';
}

  renderList();
};

$('#emo').innerHTML = EMO.map(e => `<button type="button">${e}</button>`).join('');
$('#emo').onclick = e => { if (e.target.tagName === 'BUTTON') { const i = $('#msg'); i.focus(); i.setRangeText(e.target.textContent, i.selectionStart, i.selectionEnd, 'end'); } };
$('#eb').onclick = () => $('#emo').classList.toggle('hidden');

/* ==========================================================
   YANGI GURUH / KANAL
   ========================================================== */
function nwUi() {
  $('#nmem').innerHTML = $('#nt').value === 'g' ? U().filter(u => u.id !== me.id && !u.bot).map(u => `<label class="ck"><input type="checkbox" value="${u.id}"> ${esc(u.name)} <small style="color:var(--mu)">${esc(u.email)}</small></label>`).join('') || '<div class="empty">Boshqa foydalanuvchilar yo\'q</div>' : '';
}
$('#new').onclick = () => { $('#nname').value = ''; $('#nw').classList.remove('hidden'); nwUi(); };
$('#nt').onchange = nwUi;
$('#nx').onclick = () => $('#nw').classList.add('hidden');
$('#mk').onclick = async () => {
  const n = $('#nname').value.trim(); if (!n) return alert('Nom kiriting');
  const t = $('#nt').value, m = [me.id, ...[...$('#nmem').querySelectorAll('input:checked')].map(x => +x.value)];
  const chat = { id:'g'+uid(), t, name:n, o:me.id, m };
  const r = await API.createChat(chat);
  ls.set('tg_c', [...C(), r?.chat || chat]);
  $('#nw').classList.add('hidden');
  open(chat.id);
};

/* ==========================================================
   PROFIL
   ========================================================== */
function tfaUi() {
  $('#tfs').textContent = me.tfa ? '🔒 2FA yoqilgan' : '🔓 2FA o\'chiq';
  $('#tf').textContent = me.tfa ? '2FA ni o\'chirish' : '2FA ni yoqish';
  $('#p1').placeholder = me.tfa ? 'Joriy 2FA parol' : 'Yangi 2FA parol (kamida 6 belgi)';
  $('#p1').value = '';
}
$('#menu').onclick = () => { $('#ov').classList.remove('hidden'); $('#mav').innerHTML = avHtml(me); $('#nn').value = me.name; $('#un').value = me.username || ''; tfaUi(); };
$('#x').onclick = () => $('#ov').classList.add('hidden');

async function upd(p) {
  const us = U(), i = us.findIndex(u => u.id === me.id);
  us[i] = {...us[i], ...p};
  ls.set('tg_u', us); me = us[i];
  await API.updateUser({ id:me.id, ...p });
  render();
}

$('#sv').onclick = async () => {
  const n = $('#nn').value.trim(), un = $('#un').value.trim().replace(/^@/, '');
  if (!n) return;
  if (un && !/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(un)) return alert('Username lotin harf bilan boshlanib, 3-32 belgi bo\'lsin');
  if (un && U().some(u => u.id !== me.id && (u.username||'').toLowerCase() === un.toLowerCase())) return alert('Bu username band');
  await upd({ name:n, username:un || null });
  $('#ov').classList.add('hidden');
};
$('#pic').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f, 256, async d => { await upd({ avatar:d }); $('#mav').innerHTML = avHtml(me); });
};
$('#tf').onclick = async () => {
  const p = $('#p1').value;
  if (me.tfa) { if (await kdf(p, me.salt) !== me.tfa) return alert('Parol xato'); await upd({ tfa:null }); }
  else { if (p.length < 6) return alert('Parol kamida 6 belgi'); await upd({ tfa: await kdf(p, me.salt) }); }
  tfaUi();
};
$('#lo').onclick = () => { try { localStorage.removeItem('tg_s'); } catch(e){} location.reload(); };
addEventListener('storage', () => me && render());

/* ==========================================================
   POLLING
   ========================================================== */
setInterval(async () => {
  if (!me) return;
  const r = await API.messages();
  if (!r?.messages) return;
  const local = M();
  const newOnes = r.messages.filter(m => !local.some(x => x.id === m.id));
  if (newOnes.length) {
    ls.set('tg_m', r.messages);
    if (peer) render();
    renderList();
  }
}, 5000);

/* ==========================================================
   START
   ========================================================== */
(async () => {
  await syncFromServer();
  const id = ls.get('tg_s', null), u = id && uBy(id);
  u ? login(u) : toEmail();
})();
</script>
<script>
/* ==========================================================
   QO'SHIMCHA TELEGRAM-USLUBIDAGI FUNKSIYALAR
   Asl kod va mavjud funksiyalar o'chirilmagan.
   ========================================================== */
(() => {
  const $x = s => document.querySelector(s);
  const onlineKey = 'uzm_online_v1';
  let recorder = null, chunks = [], recording = false, stream = null;

  // Media yuborishni qulaylashtirish: rasm/video/audio fayllari ham tanlanadi.
  const fileInput = $x('#file');
  if (fileInput) fileInput.accept = 'image/*,video/*,audio/*,.pdf,.txt,.doc,.docx';

  // Ovozli xabar tugmasi — bosib yozishni boshlash, yana bosib yuborish.
  const bar = $x('#form');
  if (bar && !$x('#voiceBtn')) {
    const mic = document.createElement('button');
    mic.type = 'button'; mic.id = 'voiceBtn'; mic.className = 'ib';
    mic.title = 'Ovozli xabar yozish / to‘xtatib yuborish'; mic.textContent = '🎙️';
    mic.style.flexShrink = '0';
    const sendButton = bar.querySelector('button.send');
    bar.insertBefore(mic, sendButton || null);
    mic.addEventListener('click', async () => {
      if (!recording) {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          alert('Bu brauzerda ovoz yozish qo‘llab-quvvatlanmaydi.'); return;
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio:true });
          chunks = [];
          recorder = new MediaRecorder(stream);
          recorder.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
          recorder.onstop = async () => {
            try {
              const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
              if (blob.size) {
                const key = 'voice' + (typeof uid === 'function' ? uid() : Date.now());
                await fput(key, blob);
                const file = { name:'Ovozli xabar.webm', type:blob.type || 'audio/webm', size:blob.size, key };
                if (typeof push === 'function') push(file, '');
              }
            } catch (err) { alert('Ovozli xabarni saqlab bo‘lmadi.'); }
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null; chunks = []; recorder = null;
            recording = false; mic.textContent = '🎙️'; mic.title = 'Ovozli xabar yozish';
            mic.style.color = '';
          };
          recorder.start(); recording = true;
          mic.textContent = '⏹️'; mic.title = 'To‘xtatish va yuborish'; mic.style.color = '#ff7676';
        } catch (err) { alert('Mikrofonga ruxsat bering va qayta urinib ko‘ring.'); }
      } else if (recorder && recorder.state !== 'inactive') {
        recorder.stop();
      }
    });
  }

  // Online holati (ushbu brauzer/origin ichidagi sessiyalar o‘rtasida).
  function readOnline() {
    try { return JSON.parse(localStorage.getItem(onlineKey) || '{}'); } catch(e) { return {}; }
  }
  function setOnline() {
    if (!me) return;
    const all = readOnline(); all[String(me.id)] = Date.now();
    try { localStorage.setItem(onlineKey, JSON.stringify(all)); } catch(e) {}
  }
  function userOnline(id) {
    const t = readOnline()[String(id)];
    return !!t && Date.now() - t < 25000;
  }
  setOnline(); setInterval(setOnline, 8000);
  window.addEventListener('beforeunload', () => {
    if (!me) return;
    const all = readOnline(); delete all[String(me.id)];
    try { localStorage.setItem(onlineKey, JSON.stringify(all)); } catch(e) {}
  });
  window.addEventListener('storage', e => { if (e.key === onlineKey && peer) updateStatus(); });

  // Asl bar() funksiyasini saqlab qolamiz, faqat status matnini yangilaymiz.
  const oldBar = window.bar;
  if (typeof oldBar === 'function') {
    window.bar = function() { oldBar(); updateStatus(); };
  }
  function updateStatus() {
    if (!peer || !me) return;
    const status = $x('#ps'); if (!status) return;
    try {
      const i = typeof info === 'function' ? info(peer) : null;
      if (i?.u && !i.u.bot) status.textContent = userOnline(i.u.id) ? '🟢 online' : 'oxirgi faollik yaqinda';
      else if (i?.t === 'd' && i.u?.bot) status.textContent = '🤖 bot';
    } catch(e) {}
  }

  // Xabar o'qilganida mavjud markRead() ishlaydi; shaxsiy chatda yuborilgan
  // xabarlarga ✓/✓✓ belgisi qo'shiladi. Server bo'lmasa, holat lokal bo'ladi.
  const oldRenderMsgs = window.renderMsgs;
  if (typeof oldRenderMsgs === 'function') {
    window.renderMsgs = function() {
      oldRenderMsgs();
      try {
        const chatId = peer;
        if (!chatId || chatId[0] !== 'd') return;
        const ids = chatId.slice(1).split('_').map(Number);
        const otherId = ids.find(id => id !== Number(me.id));
        const readMap = JSON.parse(localStorage.getItem('tg_r' + otherId) || '{}');
        document.querySelectorAll('#msgs .m.me[data-id]').forEach(node => {
          const msg = M().find(x => String(x.id) === String(node.dataset.id));
          if (!msg) return;
          const tick = document.createElement('small');
          tick.className = 'uzm-ticks';
          tick.textContent = (readMap[chatId] || 0) >= msg.at ? ' ✓✓' : ' ✓';
          tick.title = tick.textContent.includes('✓✓') ? 'O‘qildi' : 'Yuborildi';
          tick.style.cssText = 'font-size:.72rem;color:' + (tick.textContent.includes('✓✓') ? '#69c8ff' : '#9fb3c8') + ';margin-left:3px';
          const time = node.querySelector('i'); (time || node).appendChild(tick);
        });
      } catch(e) {}
      updateStatus();
    };
  }
})();
</script>
