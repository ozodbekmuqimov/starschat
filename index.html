<style>
:root{--bg:#0e1621;--pn:#17212b;--ln:#0b121a;--ac:#2b95d6;--me:#2b5278;--mu:#7f91a4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#e8eef4;overflow:hidden}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;color:inherit}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:var(--pn);border-radius:18px;padding:2rem;width:360px;max-width:100%;text-align:center}
.box .logo{font-size:3.2rem}.box h1{font-size:1.3rem;margin:.4rem 0}.box p{color:var(--mu);font-size:.88rem;margin-bottom:1rem}
.box input,.md input,.md select{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin:.3rem 0 .6rem}
.box input{text-align:center}
input:focus,select:focus{outline:0;border-color:var(--ac)}
.btn{width:100%;padding:.8rem;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.link{color:var(--ac);font-size:.82rem;margin-top:.6rem}
#err{color:#f87171;font-size:.82rem;min-height:1.1rem;margin-top:.5rem}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;left:12px;max-width:340px;margin-left:auto;background:#223244;border-left:4px solid var(--ac);padding:.8rem 1rem;border-radius:10px;font-size:.88rem;z-index:60;box-shadow:0 6px 24px #0008}
#toast b{font-size:1.2rem;letter-spacing:3px}
#app{height:100%;display:flex}
.side{width:340px;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex-shrink:0}
.top{display:flex;gap:.4rem;align-items:center;padding:.7rem}
.ib{width:40px;height:40px;border-radius:50%;font-size:1.25rem;flex-shrink:0}.ib:hover{background:#223244}
.send{background:var(--ac);color:#fff}
#q{flex:1;min-width:0;padding:.55rem 1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
.list{flex:1;overflow-y:auto}
.hdr{color:var(--ac);font-size:.75rem;font-weight:700;padding:.7rem 1rem .3rem}
.row{display:flex;gap:.7rem;padding:.65rem .8rem;align-items:center;cursor:pointer}
.row:hover{background:#1f2c3a}.row.on{background:var(--me)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4fb3f6,#2b6cb0);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:.4rem}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mu);font-weight:400;font-size:.7rem}
.pv{color:var(--mu);font-size:.8rem;display:flex;justify-content:space-between;gap:.4rem}
.pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un{background:var(--ac);color:#fff;border-radius:999px;font-size:.7rem;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.empty{color:var(--mu);text-align:center;padding:2rem 1rem;font-size:.85rem;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.ph{margin:auto;color:var(--mu);background:#182533;padding:.4rem 1rem;border-radius:999px;font-size:.85rem}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.hd{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;background:var(--pn);border-bottom:1px solid var(--ln)}
.hd small{display:block;color:var(--mu);font-size:.75rem}
.back{display:none;font-size:1.3rem}
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.m{max-width:72%;padding:.45rem .75rem;border-radius:14px;font-size:.93rem;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:#182533;border-bottom-left-radius:4px}
.m i{font-style:normal;font-size:.65rem;color:#9fb3c8;margin-left:.6rem;float:right;margin-top:.45rem}
.m img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-bottom:.3rem}
.sn{display:block;color:#6ab7f0;font-size:.78rem}
.fc{display:flex;gap:.6rem;align-items:center;color:inherit;text-decoration:none;background:#0003;padding:.5rem;border-radius:10px;margin-bottom:.3rem;word-break:break-all}
.fc small{color:#9fb3c8}
.big{font-size:2.2rem;line-height:1.2}
.day{align-self:center;background:#182533;color:var(--mu);font-size:.72rem;padding:.15rem .7rem;border-radius:999px;margin:.4rem 0}
.bar{display:flex;gap:.3rem;padding:.6rem .8rem;background:var(--pn);align-items:center}
#msg{flex:1;min-width:0;padding:.7rem 1.1rem;border-radius:999px;border:1px solid transparent;background:var(--bg)}
#att{padding:.4rem 1rem;background:var(--pn);font-size:.82rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln)}
#jb{padding:.8rem;background:var(--pn);text-align:center;color:var(--mu);font-size:.88rem}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;padding:.5rem;background:var(--pn);border-top:1px solid var(--ln);max-height:190px;overflow-y:auto}
#emo button{font-size:1.5rem;padding:.25rem;border-radius:8px}#emo button:hover{background:#223244}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:1rem}
.md{background:var(--pn);border-radius:16px;padding:1.5rem;width:380px;max-width:100%;max-height:90%;overflow-y:auto;text-align:center}
.md h2{font-size:1.1rem;color:var(--ac);margin-bottom:.6rem}
.md .av{width:90px;height:90px;font-size:2rem;margin:0 auto .6rem}
.sec{border-top:1px solid var(--ln);margin-top:1rem;padding-top:1rem;font-size:.85rem;color:var(--mu)}
.out{margin-top:.8rem;color:#f87171;font-weight:600}
.ck{display:flex;gap:.6rem;align-items:center;padding:.35rem 0;text-align:left;font-size:.9rem}
.ck input{width:auto;margin:0}
.navt{display:flex;border-bottom:1px solid var(--ln)}.nt{flex:1;padding:.6rem;color:var(--mu);font-size:.85rem;border-bottom:2px solid transparent}.nt.on{color:var(--ac);border-color:var(--ac)}
.lg{width:34px;height:34px;border-radius:50%;flex-shrink:0}.box img.logo{width:104px;height:104px;border-radius:50%;display:block;margin:0 auto}
#feed{flex:1;display:flex;flex-direction:column;min-height:0}.fbody{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem;align-items:center}.fbody>*{width:100%;max-width:600px}#fl{display:flex;flex-direction:column;gap:1rem}
.pc{background:var(--pn);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}.pc textarea{background:transparent;border:0;color:inherit;resize:none;min-height:56px;outline:0;font:inherit}.pc img,.pc video,.m video{max-width:100%;border-radius:10px}.m audio{max-width:100%}
.ph2{display:flex;gap:.7rem;align-items:center}.ph2 small{display:block;color:var(--mu);font-size:.72rem}.pb{white-space:pre-wrap;word-wrap:break-word}.pa{display:flex;gap:.8rem;align-items:center;color:var(--mu);font-size:.85rem}
@supports(height:100dvh){html,body,#app,#auth{height:100dvh}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.box{animation:up .4s}.box.sw{animation:pop .25s}#app{animation:fd .4s}.ov{animation:fd .2s}.ov>.md{animation:pop .22s}#chat,#feed{animation:sl .25s}.ph{animation:fd .3s}.msgs>.m:last-child,.pc{animation:up .25s}
.rv{width:200px;height:200px;border-radius:50%;object-fit:cover;display:block;cursor:pointer;border:3px solid var(--ac)}#rpv{align-self:center;margin:.5rem;cursor:default}
#pin{padding:.4rem 1rem;background:var(--pn);border-bottom:1px solid var(--ln);border-left:3px solid var(--ac);font-size:.82rem;cursor:pointer;display:flex;gap:.5rem;align-items:center}#pin span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pin small{color:var(--mu)}
#sel{display:flex;justify-content:space-between;align-items:center;padding:.4rem 1rem;background:#223244}.m.sel{outline:2px solid var(--ac)}.pm{float:left;margin-right:.3rem;font-size:.7rem}#rbar{gap:.8rem;align-items:center}#pav,#pn{cursor:pointer}
.md textarea{width:100%;min-height:150px;padding:.7rem;border-radius:10px;border:1px solid #2a3948;background:var(--bg);margin:.3rem 0 .6rem;font:12px/1.4 ui-monospace,Consolas,monospace;color:#c9d6e3;resize:vertical}.md .ck button{margin-left:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:800px){.side{width:100%}.back{display:block}.in-chat .side{display:none}#app:not(.in-chat) .main{display:none}#app.feed .side{display:none}#app.feed .main{display:flex!important}.m{max-width:86%}input,textarea{font-size:16px!important}.box{padding:1.5rem}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3948;border-radius:3px}
</style>
</head>
<body>

<script>
/* ==========================================================
   UZ Messenger — original kod + server qatlami
   Hech narsa o'chirilmagan. Faqat qo'shilgan/tuzatilgan:
   - API obyekti (server bilan aloqa)
   - syncFromServer()
   - addCt, qidiruv, uname, push, form.onsubmit, #pp, #mk,
     #jbtn, polling, start IIFE — serverga ulandi
   ========================================================== */
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return 1}catch(e){alert('Xotira to\'ldi. Kichikroq fayl yuboring.');return 0}}};
const U=()=>ls.get('tg_u',[]),M=()=>ls.get('tg_m',[]),C=()=>ls.get('tg_c',[]);
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kdf=async(p,s)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
 const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:150000,hash:'SHA-256'},k,256);
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const EMO='😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😢 😭 😡 👍 👎 👏 🙏 💪 🔥 ❤️ 💔 🎉 ✨ 🌹 🎁 ☕ 🍕 ⚽ 🚀 🌍 😴 🤝 👋 😱 🥰 😇 🙄 😅 🤗 🤩 😜 🫡 🥳 😏 🤯 😬 🙌 💯 ✅ ❌ ⭐ 🌙 ☀️ 🐱 🐶 🍉 🎵'.split(' ');
let me=null,peer=null,flow={},q='',att=null;
const uBy=id=>U().find(u=>u.id===id);
const sz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
const tm=t=>new Date(t).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
const dayOf=t=>new Date(t).toLocaleDateString('uz-UZ',{day:'numeric',month:'long'});
const avHtml=u=>u.avatar?`<img src="${u.avatar}" alt="">`:esc((u.name||'?')[0].toUpperCase());
const dmId=(a,b)=>`d${Math.min(a,b)}_${Math.max(a,b)}`;
const apk=f=>/\.apk$/i.test(f.name)||f.type==='application/vnd.android.package-archive';
// fayllar IndexedDB da (hajm cheklovi yo'q, faqat qurilma xotirasi)
const idb=new Promise(r=>{try{const q=indexedDB.open('tgf',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const fput=async(k,b)=>{const d=await idb;if(!d)throw 0;return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=ok;t.onerror=no})};
const fget=async k=>{const d=await idb;return d?new Promise(ok=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}):null};
const urls={};const furl=async k=>{if(urls[k])return urls[k];const b=await fget(k);return b?(urls[k]=URL.createObjectURL(b)):''};
const fileHtml=f=>{const t=f.type||'',n=esc(f.name),card=a=>`<a class="fc" ${a} download="${n}">📎<span>${n}<br><small>${sz(f.size)}</small></span></a>`;
 if(f.data)return t.startsWith('image/')?`<img src="${f.data}" alt="">`:card(`href="${f.data}"`);
 const k=`data-k="${esc(f.key)}"`;if(f.rec==='v')return `<video class="rv" ${k} playsinline loop></video>`;return t.startsWith('image/')?`<img ${k} alt="">`:t.startsWith('video/')?`<video controls ${k}></video>`:t.startsWith('audio/')?`<audio controls ${k}></audio>`:card(k)};
const hydrate=el=>el.querySelectorAll('[data-k]').forEach(async n=>{const u=await furl(n.dataset.k);if(u)n[n.tagName==='A'?'href':'src']=u});

/* ==========================================================
   API — Vercel serverless bilan aloqa
   Server bo'lmasa, funksiyalar null qaytaradi (lokal rejim saqlanadi)
   ========================================================== */
const API = {
  async req(path, opts) {
    try {
      const r = await fetch(path, opts);
      if (!r.ok) return null;
      return await r.json();
    } catch(e) { return null; }
  },
  users(q) { return this.req('/api/users' + (q ? '?q=' + encodeURIComponent(q) : '')); },
  register(d) { return this.req('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d) }); },
  login(email) { return this.req('/api/login?email=' + encodeURIComponent(email)); },
  messages(chat) { return this.req('/api/messages' + (chat ? '?chat=' + encodeURIComponent(chat) : '')); },
  sendMsg(m) { return this.req('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(m) }); },
  chats() { return this.req('/api/chats'); },
  createChat(c) { return this.req('/api/chats', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(c) }); },
  joinChat(id, userId) { return this.req('/api/chats', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, userId }) }); },
  posts() { return this.req('/api/posts'); },
  createPost(p) { return this.req('/api/posts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) }); },
  deletePost(id) { return this.req('/api/posts?id=' + encodeURIComponent(id), { method:'DELETE' }); },
  updateUser(u) { return this.req('/api/users', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(u) }); }
};

async function syncFromServer() {
  const [u, m, c, p] = await Promise.all([API.users(), API.messages(), API.chats(), API.posts()]);
  if (u?.users) ls.set('tg_u', u.users);
  if (m?.messages) ls.set('tg_m', m.messages);
  if (c?.chats) ls.set('tg_c', c.chats);
  if (p?.posts) ls.set('tg_p', p.posts);
}

function view(v){$('#app').classList.toggle('feed',v==='feed');$('#feed').classList.toggle('hidden',v!=='feed');$('#chat').classList.toggle('hidden',v==='feed'||!peer);$('#ph').classList.toggle('hidden',v==='feed'||!!peer);document.querySelectorAll('.nt').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='feed')renderFeed()}
function renderFeed(){const L=ls.get('tg_l',{});
 $('#fl').innerHTML=[...ls.get('tg_p',[])].reverse().map(p=>{const u=uBy(p.a)||{name:'?'},l=L[p.id]||[],y=l.includes(me.id);
  return `<div class="pc"><div class="ph2"><div class="av">${avHtml(u)}</div><div><b>${esc(u.name)}</b><small>${dayOf(p.at)} ${tm(p.at)}</small></div></div>${p.b?`<div class="pb">${esc(p.b)}</div>`:''}${p.file?fileHtml(p.file):''}<div class="pa"><button data-l="${p.id}">${y?'❤️':'🤍'} ${l.length}</button>${p.a===me.id?`<button data-d="${p.id}">🗑</button>`:''}</div></div>`}).join('')||'<div class="empty">Postlar yo\'q. Birinchi bo\'lib joylang!</div>';hydrate($('#fl'))}

$('#fb').onclick=()=>view('chats');
let pfile=null;
$('#pfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(apk(f))return alert('.apk fayllarni yuborib bo\'lmaydi');pfile=f;$('#pfn').textContent='📎 '+f.name};
$('#pp').onclick=async()=>{const b=$('#pt').value.trim();if(!b&&!pfile)return;let file=null;
 if(pfile){try{const key='f'+uid();await fput(key,pfile);file={name:pfile.name,type:pfile.type||'application/octet-stream',size:pfile.size,key}}catch(x){return alert('Faylni saqlab bo\'lmadi')}}
 const post={id:uid(),a:me.id,b,file,at:Date.now()};
 ls.set('tg_p',[...ls.get('tg_p',[]),post]);
 API.createPost(post);
 $('#pt').value='';pfile=null;$('#pfn').textContent='';renderFeed()};
$('#fl').onclick=e=>{const l=e.target.closest('[data-l]'),d=e.target.closest('[data-d]');
 if(l){const L=ls.get('tg_l',{}),a=L[l.dataset.l]||[],i=a.indexOf(me.id);i<0?a.push(me.id):a.splice(i,1);L[l.dataset.l]=a;ls.set('tg_l',L)}
 if(d){ls.set('tg_p',ls.get('tg_p',[]).filter(p=>String(p.id)!==d.dataset.d));API.deletePost(d.dataset.d)}
 renderFeed()};

const shrink=(f,px,cb)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,px/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=URL.createObjectURL(f)};
let rec=null,sel=null,ct=null;

const setStarted=id=>{const S=ls.get('tg_st'+me.id,{});S[id]=1;ls.set('tg_st'+me.id,S)};

 if(a.length){const m=a[a.length-1];p.dataset.id=m.id;p.innerHTML=`📌 <span>${esc(m.b||(m.file?'📎 '+m.file.name:''))}</span><small>${a.length>1?a.length+' ta qadalgan':''}</small>`}}

// ovozli xabar va dumaloq video
async function record(kind){if(rec||!peer||!info(peer).post)return;
 try{const s=await navigator.mediaDevices.getUserMedia(kind==='v'?{video:{facingMode:'user',width:480,height:480},audio:true}:{audio:true});
  const ch=[],mr=new MediaRecorder(s);rec={kind,send:true,t:Date.now()};
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=async()=>{clearInterval(rec.iv);s.getTracks().forEach(t=>t.stop());$('#rbar').classList.add('hidden');$('#rpv').classList.add('hidden');const r=rec;rec=null;bar();if(!r.send||!ch.length)return;
   const type=(mr.mimeType||'').split(';')[0]||(kind==='v'?'video/webm':'audio/webm'),b=new Blob(ch,{type}),key='f'+uid();
   try{await fput(key,b)}catch(x){return alert(`Saqlab bo'lmadi`)}
   push({name:(kind==='v'?'dumaloq-video':'ovoz')+'.webm',type,size:b.size,key,rec:kind})};
  rec.stop=send=>{rec.send=send;mr.state!=='inactive'&&mr.stop()};
  if(kind==='v'){const v=$('#rpv');v.srcObject=s;v.classList.remove('hidden');v.play().catch(()=>0)}
  $('#form').classList.add('hidden');$('#rbar').classList.remove('hidden');$('#rt').textContent='0:00';
  const lim=kind==='v'?60:600;rec.iv=setInterval(()=>{const n=Math.floor((Date.now()-rec.t)/1000);$('#rt').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n>=lim)rec.stop(true)},300);
  mr.start()}catch(e){alert(`Mikrofon/kamera ruxsati berilmadi yoki brauzer qo'llamaydi`)}}
$('#ra').onclick=()=>record('a');$('#rv').onclick=()=>record('v');$('#rx').onclick=()=>rec&&rec.stop(false);$('#rs').onclick=()=>rec&&rec.stop(true);
// bot kodi: ajratilgan (sandbox) iframe ichida ishlaydi, saqlash/kukilarga kira olmaydi
function runBot(code,ctx){return new Promise(res=>{const f=document.createElement('iframe');f.sandbox='allow-scripts';f.style.display='none';let done=0;
 const fin=o=>{if(done)return;done=1;removeEventListener('message',h);f.remove();res(o)};
 const h=e=>{if(e.source===f.contentWindow)fin(e.data)};addEventListener('message',h);
 f.srcdoc='<script>addEventListener("message",async e=>{const {code,ctx}=e.data,H={},out=[];let T=null;try{new Function("on","onText","reply","ctx",code)((c,fn)=>{H[c.toLowerCase()]=fn},fn=>{T=fn},t=>out.push(String(t)),ctx);const fn=H[ctx.cmd]||(ctx.cmd[0]!=="/"?T:null);if(fn)await fn(ctx.cmd[0]==="/"?ctx:ctx.text,ctx);parent.postMessage({out,hit:!!fn},"*")}catch(x){parent.postMessage({err:String(x)},"*")}});<\/script>';
 f.onload=()=>f.contentWindow.postMessage({code,ctx},'*');document.body.appendChild(f);setTimeout(()=>fin({err:'⏱ Kod 5 soniyada javob bermadi'}),5000)})}
// guruh / kanal / bot ma'lumotlari (rasm, nom, buyruqlar, kod)
function openCi(){const i=info(peer);if(i.t==='d'&&!i.u)return;
 const d=i.t==='d',o=d?i.u:i.c,own=d?o.owner===me.id:o.o===me.id;ct={o,d};
 $('#cav').innerHTML=i.av;$('#cname').value=o.name;$('#cname').disabled=!own;$('#cpl').classList.toggle('hidden',!own);$('#csv').classList.toggle('hidden',!own);$('#cinfo').textContent=i.sub;$('#cbot').classList.toggle('hidden',!(d&&own));
 if(d&&own){$('#ctok').textContent=o.token;$('#bcode').value=o.code||'';$('#bcode').placeholder='// Namuna:\non("/start", c => reply("Salom, " + c.name + "!"));\non("/hi", () => reply("Assalomu alaykum"));\nonText(t => reply("Siz yozdingiz: " + t));';cmdList()}
 const cb=$('#cadd');cb.classList.toggle('hidden',!(d&&i.u&&i.u.id!==1&&i.u.id!==me.id));if(d&&i.u)cb.textContent=isCt(i.u.id)?'➖ Kontaktdan olib tashlash':`➕ Kontaktga qo'shish`;
 $('#ci').classList.remove('hidden')}

// addCt — endi serverdan qidiradi, topilmasa lokal
async function addCt(s){
  s=s.trim().replace(/^@/,'').toLowerCase();
  if(!s)return;
  let found=null;
  const r=await API.users(s);
  if(r?.users&&r.users.length){
    found=r.users.find(x=>(x.username||'').toLowerCase()===s||(x.email||'').toLowerCase()===s);
  }
  if(!found) found=U().find(x=>x.id!==me.id&&((x.username||'').toLowerCase()===s||(x.email||'').toLowerCase()===s));
  if(!found)return alert('Foydalanuvchi topilmadi. U ro\'yxatdan o\'tganini tekshiring.');
  if(found.id===me.id)return alert('O\'zingizni qo\'shib bo\'lmaydi');
  if(isCt(found.id))return alert('Allaqachon kontaktlarda');
  ls.set('tg_ct'+me.id,[...cts(),found.id]);
  if(!U().some(u=>u.id===found.id))ls.set('tg_u',[...U(),found]);
  ctList();render();
}

// Qidiruv Enter — serverdan username/email bo'yicha
$('#q').onkeydown=async e=>{
  if(e.key!=='Enter')return;
  const v=$('#q').value.replace(/^@/,'').trim();
  if(!v)return;
  let u=null;
  const r=await API.users(v);
  if(r?.users&&r.users.length){
    const list=r.users;
    u=list.find(x=>(x.username||'').toLowerCase()===v.toLowerCase())||list.find(x=>(x.email||'').toLowerCase()===v.toLowerCase());
  }
  if(!u)u=U().find(x=>x.id!==me.id&&((x.username||'').toLowerCase()===v.toLowerCase()||(x.email||'').toLowerCase()===v.toLowerCase()));
  if(u){
    if(!U().some(x=>x.id===u.id))ls.set('tg_u',[...U(),u]);
    $('#q').value='';q='';open(dmId(u.id,me.id));
  } else alert('Bunday foydalanuvchi topilmadi');
};

function say(bot,c,b){setTimeout(()=>{const m={id:uid(),c,f:bot,b,file:null,at:Date.now()};ls.set('tg_m',[...M(),m]);API.sendMsg(m);render()},350)}
async function botTick(c,t){const u=peerUser(c);if(!u?.bot||!t)return;if(u.id===1)return bf(c,t);
 const k=t.split(/\s+/)[0].toLowerCase();
 if(u.code){const r=await runBot(u.code,{cmd:k,text:t,name:me.name,id:me.id});
  if(r.err)return say(u.id,c,'⚠️ Bot kodi xatosi: '+r.err);
  if(r.hit&&r.out&&r.out.length)return r.out.forEach(x=>say(u.id,c,x))}
 const cm=u.cmds||{},ks=Object.keys(cm).filter(x=>x!=='/*').join(' ');
 say(u.id,c,cm[k]||(k==='/start'?`Salom! Men ${u.name} botiman.`+(ks?'\nBuyruqlar: '+ks:''):cm['/*']||'Tushunmadim. '+(ks?'Buyruqlar: '+ks:'Egasi hali buyruq qo\'shmagan.')))}
function bf(c,t){const K='tg_bf'+me.id,S=ls.get(K,{}),r=x=>say(1,c,x),a=t.split(/\s+/),cmd=a[0].toLowerCase(),bots=()=>U().filter(u=>u.bot&&u.owner===me.id),
 own=n=>bots().find(b=>b.username.toLowerCase()===(n||'').replace('@','').toLowerCase());
 if(cmd==='/cancel'){ls.set(K,{});return r('Bekor qilindi.')}
 if(S.st==='name'&&cmd[0]!=='/'){ls.set(K,{st:'user',name:t});return r('Yaxshi. Endi bot uchun username tanlang. U "bot" bilan tugashi kerak, masalan: UZ_news_bot')}
 if(S.st==='user'&&cmd[0]!=='/'){const un=t.replace('@','');
  if(!/^[A-Za-z0-9_]{3,29}bot$/i.test(un))return r('Username "bot" bilan tugashi va faqat lotin harf, raqam, _ bo\'lishi kerak. Qayta kiriting.');
  if(U().some(u=>(u.username||'').toLowerCase()===un.toLowerCase()))return r('Bu username band. Boshqasini kiriting.');
  const id=uid(),tok=id+':'+[...crypto.getRandomValues(new Uint8Array(18))].map(x=>(x%36).toString(36)).join('');
  const botUser={id,name:S.name,email:'@'+un,username:un,bot:true,owner:me.id,token:tok,avatar:null,cmds:{}};
  ls.set('tg_u',[...U(),botUser]);API.updateUser(botUser);ls.set(K,{});
  return r(`✅ Bot yaratildi: @${un}\nToken: ${tok}\n\nBuyruq qo'shish: /setcmd ${un} /salom Assalomu alaykum!\nBotni kontaktlardan topib yozing.\n(Bu messenger ichidagi bot, haqiqiy Telegram Bot API tokeni emas.)`)}
 if(cmd==='/newbot'){ls.set(K,{st:'name'});return r('Yangi bot yaratamiz. Botga nom bering:')}
 if(cmd==='/mybots')return r(bots().map(b=>'@'+b.username).join('\n')||'Sizda bot yo\'q. /newbot');
 if(cmd==='/token'){const b=own(a[1]);return r(b?b.token:'Bot topilmadi. Namuna: /token mybot')}
 if(cmd==='/setcmd'){const b=own(a[1]),k=(a[2]||'').toLowerCase(),v=a.slice(3).join(' ');
  if(!b||k[0]!=='/'||!v)return r('Namuna: /setcmd mybot /salom Assalomu alaykum!\nStandart javob: /setcmd mybot /* Javob matni');
  const us=U(),i=us.findIndex(u=>u.id===b.id);us[i].cmds={...us[i].cmds,[k]:v};ls.set('tg_u',us);API.updateUser({id:b.id,cmds:us[i].cmds});return r('✅ '+k+' qo\'shildi')}
 if(cmd==='/delbot'){const b=own(a[1]);if(!b)return r('Bot topilmadi. Namuna: /delbot mybot');ls.set('tg_u',U().filter(u=>u.id!==b.id));return r('🗑 O\'chirildi')}
 r('Men BotFather, bot yaratuvchiman.\n/newbot: yangi bot\n/mybots: botlarim\n/setcmd: buyruq qo\'shish\n/token: tokenni ko\'rish\n/delbot: botni o\'chirish\n/cancel: bekor qilish')}
if(!U().some(u=>u.id===1))ls.set('tg_u',[{id:1,name:'BotFather',email:'@BotFather',username:'BotFather',bot:true,avatar:null,cmds:{}},...U()]);

// ---------- AUTH ----------
const err=t=>$('#err').textContent=t||'';
function step(n,t,s,ph,type='text'){flow.n=n;const bx=document.querySelector('.box');bx.classList.remove('sw');void bx.offsetWidth;bx.classList.add('sw');$('#t').textContent=t;$('#s').textContent=s;const f=$('#f');f.value='';f.type=type;f.placeholder=ph;f.focus();err();$('#re').classList.toggle('hidden',n!=='code')}
const toEmail=()=>step('email','Messenger','Email manzilingizni kiriting, tasdiqlash kodi yuboramiz','Email','email');
function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.remove('hidden');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.add('hidden'),30000)}
function sendCode(){flow.code=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);flow.exp=Date.now()+3e5;flow.tries=0;
 toast('📩 <small>Demo: server yo\'q, shuning uchun email yuborilmaydi</small><br>'+esc(flow.email)+' uchun kod: <b>'+flow.code+'</b>')}
$('#go').onclick=async()=>{
 const v=$('#f').value.trim(),n=flow.n;err();
 if(!(window.crypto&&crypto.subtle))return err('Sahifa HTTPS orqali ochilishi kerak');
 if(n==='email'){
  if(!/^\S+@\S+\.\S+$/.test(v))return err('Email noto\'g\'ri');
  flow.email=v.toLowerCase();sendCode();step('code','Kodni kiriting',flow.email+' manziliga 6 xonali kod yuborildi','000000');
 }else if(n==='code'){
  if(Date.now()>flow.exp)return err('Kod muddati tugadi, qayta yuboring');
  if(++flow.tries>5){toEmail();return err('Juda ko\'p urinish. Qaytadan boshlang')}
  if(v!==flow.code)return err('Kod noto\'g\'ri');
  flow.code=null;
  // serverdan topish
  let u=null;
  const r=await API.login(flow.email);
  if(r?.user) u=r.user;
  if(!u) u=U().find(x=>x.email===flow.email);
  if(u&&!U().some(x=>x.id===u.id))ls.set('tg_u',[...U(),u]);
  if(!u)return step('name','Ismingiz','Profil uchun ism kiriting','Ism');
  if(u.tfa){flow.u=u;flow.f=0;return step('2fa','Ikki bosqichli himoya','2FA parolingizni kiriting','Parol','password')}
  login(u);
 }else if(n==='name'){
  if(!v)return err('Ism kiriting');
  flow.name=v;return step('uname','Username tanlang',`Boshqalar sizni @username orqali topadi. Ixtiyoriy: bo'sh qoldirsangiz, keyin profildan qo'shasiz`,'username');
 }else if(n==='uname'){
  const un=v.replace(/^@/,'');
  if(un&&!/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(un))return err(`Lotin harf bilan boshlanib, 3-32 belgi (harf, raqam, _) bo'lsin`);
  // serverga ro'yxatdan o'tkazish
  const r=await API.register({name:flow.name,email:flow.email,username:un||null,salt:crypto.randomUUID()});
  if(r&&r.error)return err(r.error);
  let u=r?.user;
  if(!u){
    // server yo'q — lokal rejim
    if(un&&U().some(x=>(x.username||'').toLowerCase()===un.toLowerCase()))return err('Bu username band');
    u={id:uid(),name:flow.name,email:flow.email,username:un||null,avatar:null,tfa:null,salt:crypto.randomUUID()};
  }
  ls.set('tg_u',[...U().filter(x=>x.id!==u.id),u]);
  login(u);
 }else if(n==='2fa'){
  if(await kdf(v,flow.u.salt)===flow.u.tfa)return login(flow.u);
  if(++flow.f>=5){toEmail();return err('Juda ko\'p urinish. Qaytadan boshlang')}
  err('Parol xato ('+flow.f+'/5)');
 }};
$('#f').addEventListener('keydown',e=>e.key==='Enter'&&$('#go').click());
$('#re').onclick=()=>{sendCode();err()};
function login(u){me=u;ls.set('tg_s',u.id);$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#toast').classList.add('hidden');flow={};render()}

// ---------- CHAT DATA ----------
function info(id){
 if(id[0]==='d'){const o=+id.slice(1).split('_').find(x=>+x!==me.id),u=uBy(o);return{t:'d',name:(u?.bot?'🤖 ':'')+(u?.name||'?'),av:u?avHtml(u):'?',sub:u?(u.bot?u.email:(u.username?'@'+u.username+' · ':'')+u.email):'',mem:1,post:1,u}}
 const c=C().find(x=>x.id===id)||{m:[]},ch=c.t==='ch',mem=c.m.includes(me.id);
 return{t:c.t,c,name:c.name||'?',av:c.avatar?`<img src="${c.avatar}" alt="">`:(ch?'📢':'👥'),sub:c.m.length+(ch?' obunachi':' a\'zo'),mem,post:mem&&(!ch||c.o===me.id)}}
const myIds=()=>{const g=C().filter(c=>c.m.includes(me.id)).map(c=>c.id);
 const d=M().filter(x=>x.c[0]==='d'&&x.c.slice(1).split('_').map(Number).includes(me.id)).map(x=>x.c);return[...new Set([...g,...d])]};
function render(){if(peer){markRead();renderMsgs();bar();renderPin()}renderList()}
const markRead=()=>{const r=ls.get('tg_r'+me.id,{});r[peer]=Date.now();ls.set('tg_r'+me.id,r)};
function renderList(){
 const by={};M().forEach(x=>(by[x.c]??=[]).push(x));const rd=ls.get('tg_r'+me.id,{});
 const ids=myIds();if(peer&&!ids.includes(peer))ids.push(peer);
 const hit=s=>!q||s.toLowerCase().includes(q);
 const rows=ids.map(id=>{const i=info(id),a=by[id]||[];return{id,i,l:a.slice(-1)[0],un:a.filter(x=>x.f!==me.id&&x.at>(rd[id]||0)).length}})
  .filter(r=>hit(r.i.name)).sort((a,b)=>(b.l?.at||0)-(a.l?.at||0));
 const L=$('#list');L.innerHTML='';
 const row=(id,av,name,pv,time,un)=>{const d=document.createElement('div');d.className='row'+(peer===id?' on':'');
  d.innerHTML=`<div class="av">${av}</div><div class="info"><div class="nm"><span>${esc(name)}</span><small>${time}</small></div><div class="pv"><span>${pv}</span>${un?`<b class="un">${un}</b>`:''}</div></div>`;
  d.onclick=()=>open(id);L.appendChild(d)};
 rows.forEach(({id,i,l,un})=>row(id,i.av,i.name,l?(l.f===me.id?'Siz: ':'')+(l.file?'📎 '+esc(l.file.name):esc(l.b)):esc(i.sub),l?tm(l.at):'',un));
 const hd=t=>L.insertAdjacentHTML('beforeend',`<div class="hdr">${t}</div>`);
 const ch=C().filter(c=>c.t==='ch'&&!c.m.includes(me.id)&&hit(c.name));
 if(ch.length){hd('Kanallar');ch.forEach(c=>row(c.id,c.avatar?`<img src="${c.avatar}" alt="">`:'📢',c.name,c.m.length+' obunachi','',0))}
 const un=u=>u.username?'@'+u.username:u.email,hitU=u=>hit(u.name+u.email+(u.username?'@'+u.username:'')),
  rest=U().filter(u=>u.id!==me.id&&!ids.includes(dmId(u.id,me.id))&&hitU(u)),
  cs=rest.filter(u=>isCt(u.id)),gl=q?rest.filter(u=>!isCt(u.id)&&(u.username||'').toLowerCase().includes(q.replace(/^@/,''))):[],
  urow=u=>row(dmId(u.id,me.id),avHtml(u),(u.bot?'🤖 ':'')+u.name,esc(un(u)),'',0);
 if(cs.length){hd('Kontaktlar');cs.forEach(urow)}
 if(gl.length){hd('Global qidiruv (@username)');gl.forEach(urow)}
 if(!L.children.length)L.innerHTML='<div class="empty">Hech narsa topilmadi.<br>Kishini topish uchun qidiruvga @username yozing yoki 👤 Kontaktlar orqali qo\'shing.</div>'}
function open(id){peer=id;att=null;view('chats');$('#sel').classList.add('hidden');const cc=$('#chat');cc.style.animation='none';void cc.offsetWidth;cc.style.animation='';$('#att').classList.add('hidden');$('#app').classList.add('in-chat');$('#ph').classList.add('hidden');$('#chat').classList.remove('hidden');
 const i=info(id);$('#pn').textContent=i.name;$('#ps').textContent=i.sub;$('#pav').innerHTML=i.av;render();$('#msg').focus()}

const onlyEmoji=s=>/^(\p{Extended_Pictographic}|\p{Emoji_Modifier}|\u200d|\ufe0f|\s){1,6}$/u.test(s);
function renderMsgs(){
 const E=$('#msgs'),i=info(peer);let last='',h='';
 M().filter(x=>x.c===peer).forEach(m=>{const d=dayOf(m.at);if(d!==last){last=d;h+=`<div class="day">${d}</div>`}
  const mine=m.f===me.id,u=uBy(m.f),f=m.file?fileHtml(m.file):'';
  h+=`<div class="m ${mine?'me':'th'}" data-id="${m.id}">${(pins()[peer]||[]).includes(m.id)?'<small class="pm">📌</small>':''}${!mine&&i.t==='g'&&u?`<b class="sn">${esc(u.name)}</b>`:''}${f}${m.b?`<span class="${onlyEmoji(m.b)&&!m.file?'big':''}">${esc(m.b)}</span>`:''}<i>${tm(m.at)}</i></div>`});
 E.innerHTML=h||'<div class="empty" style="margin:auto">Hozircha xabar yo\'q 👋</div>';hydrate(E);E.scrollTop=E.scrollHeight}
$('#form').onsubmit=async e=>{e.preventDefault();const b=$('#msg').value.trim();if((!b&&!att)||!peer||!info(peer).post)return;
 let file=null;if(att){try{const key='f'+uid();await fput(key,att.file);file={name:att.name,type:att.type,size:att.size,key}}catch(x){return alert('Faylni saqlab bo\'lmadi (qurilma xotirasi to\'lgan bo\'lishi mumkin)')}}
 const msg={id:uid(),c:peer,f:me.id,b,file,at:Date.now()};
 if(ls.set('tg_m',[...M(),msg])){API.sendMsg(msg);$('#msg').value='';att=null;$('#att').classList.add('hidden');render();if(peer[0]==='d')botTick(peer,b)}};
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 if(apk(f))return alert('.apk fayllarni yuborib bo\'lmaydi');
 att={file:f,name:f.name,type:f.type||'application/octet-stream',size:f.size};$('#an').textContent='📎 '+f.name+' ('+sz(f.size)+')';$('#att').classList.remove('hidden')};
$('#ax').onclick=()=>{att=null;$('#att').classList.add('hidden')};
$('#jbtn').onclick=async()=>{const i=info(peer);if(i.u?.bot){setStarted(i.u.id);push(null,'/start');return}
 const r=await API.joinChat(peer,me.id);
 if(r&&!r.error){const cs=C();const c=cs.find(c=>c.id===peer);if(c&&!c.m.includes(me.id))c.m.push(me.id);ls.set('tg_c',cs)}
 render()};
$('#back').onclick=()=>{peer=null;$('#app').classList.remove('in-chat');$('#chat').classList.add('hidden');$('#ph').classList.remove('hidden');renderList()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();renderList()};
// emoji (kursor joyiga qo'shiladi)
$('#emo').innerHTML=EMO.map(e=>`<button type="button">${e}</button>`).join('');
$('#emo').onclick=e=>{if(e.target.tagName==='BUTTON'){const i=$('#msg');i.focus();i.setRangeText(e.target.textContent,i.selectionStart,i.selectionEnd,'end')}};
$('#eb').onclick=()=>$('#emo').classList.toggle('hidden');

// ---------- YANGI GURUH / KANAL ----------
function nwUi(){$('#nmem').innerHTML=$('#nt').value==='g'?U().filter(u=>u.id!==me.id&&!u.bot).map(u=>`<label class="ck"><input type="checkbox" value="${u.id}"> ${esc(u.name)} <small style="color:var(--mu)">${esc(u.email)}</small></label>`).join('')||'<div class="empty">Boshqa foydalanuvchilar yo\'q</div>':''}
$('#new').onclick=()=>{$('#nname').value='';$('#nw').classList.remove('hidden');nwUi()};
$('#nt').onchange=nwUi;$('#nx').onclick=()=>$('#nw').classList.add('hidden');
$('#mk').onclick=async()=>{if($('#nt').value==='bot'){$('#nw').classList.add('hidden');setStarted(1);open(dmId(me.id,1));return bf(dmId(me.id,1),'/newbot')}const n=$('#nname').value.trim();if(!n)return alert('Nom kiriting');
 const t=$('#nt').value,m=[me.id,...[...$('#nmem').querySelectorAll('input:checked')].map(x=>+x.value)];
 const chat={id:'g'+uid(),t,name:n,o:me.id,m};
 const r=await API.createChat(chat);
 ls.set('tg_c',[...C(),r?.chat||chat]);$('#nw').classList.add('hidden');open(chat.id)};

// ---------- PROFIL / 2FA ----------
function tfaUi(){$('#tfs').textContent=me.tfa?'🔒 2FA yoqilgan':'🔓 2FA o\'chiq. Qo\'shimcha parol bilan himoyalang';
 $('#tf').textContent=me.tfa?'2FA ni o\'chirish':'2FA ni yoqish';$('#p1').placeholder=me.tfa?'Joriy 2FA parol':'Yangi 2FA parol (kamida 6 belgi)';$('#p1').value=''}
$('#menu').onclick=()=>{$('#ov').classList.remove('hidden');$('#mav').innerHTML=avHtml(me);$('#nn').value=me.name;$('#un').value=me.username||'';tfaUi()};
$('#x').onclick=()=>$('#ov').classList.add('hidden');
function upd(p){const us=U(),i=us.findIndex(u=>u.id===me.id);us[i]={...us[i],...p};ls.set('tg_u',us);me=us[i];API.updateUser({id:me.id,...p});render()}
$('#sv').onclick=()=>{const n=$('#nn').value.trim(),un=$('#un').value.trim().replace(/^@/,'');if(!n)return;
 if(un&&!/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(un))return alert(`Username lotin harf bilan boshlanib, 3-32 ta harf, raqam yoki _ dan iborat bo'lsin`);
 if(un&&U().some(u=>u.id!==me.id&&(u.username||'').toLowerCase()===un.toLowerCase()))return alert('Bu username band');
 upd({name:n,username:un||null});$('#ov').classList.add('hidden')};
$('#pic').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,256/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);upd({avatar:c.toDataURL('image/jpeg',.85)});$('#mav').innerHTML=avHtml(me)};im.src=URL.createObjectURL(f)};
$('#tf').onclick=async()=>{const p=$('#p1').value;
 if(me.tfa){if(await kdf(p,me.salt)!==me.tfa)return alert('Parol xato');upd({tfa:null})}
 else{if(p.length<6)return alert('Parol kamida 6 belgi bo\'lsin');upd({tfa:await kdf(p,me.salt)})}
 tfaUi()};
$('#lo').onclick=()=>{try{localStorage.removeItem('tg_s')}catch(e){}location.reload()};
addEventListener('storage',()=>me&&render());

// ---------- POLLING — yangi xabarlar (serverdan) ----------
setInterval(async()=>{
 if(!me)return;
 const r=await API.messages();
 if(!r?.messages)return;
 const local=M();
 const newOnes=r.messages.filter(m=>!local.some(x=>x.id===m.id));
 if(newOnes.length){ls.set('tg_m',r.messages);if(peer)render();renderList()}
},5000);

// ---------- START ----------
(async()=>{
  await syncFromServer();
  const id=ls.get('tg_s',null),u=id&&uBy(id);
  u?login(u):toEmail();
})();
